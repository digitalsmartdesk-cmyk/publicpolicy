<style>

*{box-sizing:border-box;}html{scroll-behavior:smooth;}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.65;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}

.hero{display:flex;flex-direction:column;gap:16px;padding-top:8px;}

.btns{display:flex;flex-wrap:wrap;gap:10px;}
.btn{display:inline-block;background:var(--accent);color:var(--bg);text-decoration:none;font-weight:600;font-size:15px;padding:10px 16px;border-radius:6px;}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);}
.partgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:4px;}
.partcard{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px;text-decoration:none;color:var(--fg);transition:border-color .15s;}.partcard:hover{border-color:var(--accent);}
.pnum{font-family:var(--font-mono);font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--accent);}
.ptitle{font-family:var(--font-display);font-size:18px;font-weight:600;line-height:1.2;}
.pdesc{font-size:13.5px;color:var(--ink2);line-height:1.45;}

.chlist a{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:12px 14px;text-decoration:none;color:var(--fg);}

.foot{max-width:820px;margin:0 auto;padding:20px 0 48px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink2);display:flex;flex-direction:column;gap:4px;}

  buildPrologue(){
    const t=this.tier.bind(this),f=this.fig.bind(this),s=this.sec.bind(this);
    return '<article>'+this.chead('Prologue','The First Rung','India\'s technology sector is still adding jobs. It is adding fewer than its revenue would suggest, and the first rung of the ladder is where the slowdown shows.',this.stat('2.3%','Growth in tech-sector employment in FY26, against 6.1% growth in revenue')+this.stat('−44%','Fall in entry-level tech openings in June 2026 on a year earlier')+this.stat('15.9%','Unemployment among 15- to 29-year-olds, April to June 2026'),'A generation of Indian graduates took it for granted that a degree led to a tech job. This book asks whether that is still true, what the numbers say, and what is not yet counted.')+
    s('The pattern','In FY26 the sector\'s revenue grew nearly three times as fast as its payroll','<p>Nasscom, the industry body, estimates that India\'s technology sector earned $315 billion in FY26, up 6.1%. It employed 59.5 lakh people, up 2.3%. The sector is still a net hirer. It added about 1.35 lakh jobs, a little more than the year before. But each rupee of new revenue needed far fewer new people than it used to.</p>'+f('p_growth','<b>Chart P.1</b> · Growth in revenue and in employment, Indian technology sector, FY26.','Nasscom estimate of 24 February 2026, as reported by Storyboard18 and The Core.','rep','Revenue growth is 2.7 times employment growth')+'<p>The gap is not new in kind. Software has long grown by raising the revenue each person earns. What is new is the setting: the largest firm cut its headcount, openings for people with up to two years of experience fell in 2026 and young Indians are finding work harder to come by.</p>')+
    s('The claim','This book does not claim that AI has taken these jobs','<p>Three things could each slow hiring at the bottom of the ladder: weak demand for outsourced IT services, a restructuring of how firms staff projects, and the adoption of AI tools that do routine work. The numbers here cannot separate them. Where a firm or an industry body has said what it is doing, the book reports that. Where it has not, the book says so.</p><p>What the numbers can do is show where the squeeze is, who stands in it and what is not being counted. That is the case for a measure. {ch:13} proposes one.</p>')+
    s('The plan','Five parts: the ladder, the other sectors, the people, the measure, the response','<p>Part I looks at the tech sector\'s engine and its entry point. Part II asks where else a squeeze might show first: back offices, capability centres and other white-collar work. Part III looks at who is hit. Part IV is about measurement: what India counts today and what it would take to count the right thing. Part V looks at what governments have done, and sets out options for India with their trade-offs.</p>')+
    this.take('Revenue is growing and the payroll is not growing with it. The place to look is the first job.')+
    '<section class="sec"><p class="note" style="font-style:italic">How to read this book. Every chart has a source line and an evidence tag. '+t('primary')+' means the figure was read from the original release. '+t('derived')+' means our arithmetic on figures shown. '+t('rep')+' means the figure comes from a press report of a company, industry body or staffing firm release that we have not read in the original. '+t('illus')+' means a worked example with its assumptions stated. Where we found no figure we say so and do not estimate one.</p></section>'+
    this.pager(null,{k:'ch-1',dir:'Chapter 1',title:'The Engine',ts:'59.5 lakh employees, $315 billion in revenue.'})+'</article>';
  }

1:{kicker:'Chapter 1 · Part 1: The Engine',title:'The Engine',dek:'India\'s technology sector employs 59.5 lakh people and earns $315 billion. It is the largest private employer of graduates, and it is growing without hiring at the same pace.',stats:[['59.5 lakh','Employees, FY26 estimate'],['1.35 lakh','Net jobs added in FY26, against 1.33 lakh in FY25'],['$315 bn','Revenue, FY26 estimate, up 6.1%']],stand:'Before looking at the first rung, look at the building. This chapter sets out the size of the sector, how its payroll has moved and how much of its revenue is called AI.',sections:[
{k:'Size',h2:'The sector added 3.3 lakh jobs in the three years to FY26, after 2.9 lakh in FY23 alone',body:'<p>Nasscom\'s first estimate for FY23 put the workforce at over 5.4 million, with a net addition of about 2.9 lakh. FY24 added about 60,000. FY25 added 1.33 lakh, and FY26 about 1.35 lakh. The sector has not stopped hiring. It has settled at a much lower rate than in FY23.</p>'+f('n1_net','<b>Chart 1.1</b> · Net jobs added each year, lakh.',NAS,'rep','Net additions fell from 2.9 lakh to 0.6 lakh and have since recovered to 1.3 lakh')+f('n1_emp','<b>Chart 1.2</b> · Employees in the technology sector, million.',NAS,'rep')},
{k:'Money',h2:'Reported revenue is about $70 billion higher than in FY23',body:'<p>Reported revenue rose from $245 billion in FY23 to $254 billion in FY24, to a revised $297 billion in FY25 and an estimated $315 billion in FY26. Nasscom revised FY25 up from $282.6 billion when it published FY26.</p>'+f('n1_rev','<b>Chart 1.3</b> · Revenue of the technology sector, $ billion.','Nasscom, as first reported for FY23 and FY24; FY25 as revised and FY26 as estimated in February 2026.','rep')+f('n1_growth','<b>Chart 1.4</b> · Growth in revenue and in employment, FY26, with FY25 revenue growth for comparison.',NAS,'rep')},
{k:'Ratio',h2:'Each employee now stands behind about $53,000 of revenue, up 3.7% in a year',body:'<p>Dividing revenue by employees gives a rough measure of how much each worker earns for the sector. Revenue per employee rose from about $51,000 in FY25 to about $52,900 in FY26.</p>'+f('n1_rpe','<b>Chart 1.5</b> · Revenue per employee, $ thousand, on Nasscom\'s FY25 (revised) and FY26 figures.','Calculated from Nasscom revenue and employee estimates reported in February 2026.','derived')+'<p>Nasscom estimates that AI and new-age services earned $10 to 12 billion of FY26 revenue. That is 3 to 4% of the total.</p>'+f('n1_ai','<b>Chart 1.6</b> · AI revenue as a share of FY26 sector revenue, low and high end of Nasscom\'s estimate.','Calculated from the $10 to 12 billion range and the $315 billion total, Nasscom, February 2026.','derived')}],
contested:[['Revisions','Nasscom revises past years when it publishes new ones: FY25 revenue went from $282.6 billion to $297 billion. Charts here use each figure as reported.'],['Net hirer','Nasscom calls the sector a net hirer in FY26. That is true, but net additions are a small share of the 59.5 lakh base, and gross hiring and attrition are not published.'],['Estimates','The FY26 figures were published on 24 February 2026, before the year ended.']],
takeaway:'The sector is large and still growing. It no longer needs many more people to grow, and that changes what a young engineer can count on.'},

2:{kicker:'Chapter 2 · Part 1: The Engine',title:'Revenue Without Headcount',dek:'The big firms earn more per employee each year. In FY26 the largest of them did it while cutting its workforce.',stats:[['+3.4%','Rise in TCS revenue per employee in FY26, while headcount fell 3.9%'],['+4.1%','Rise at HCLTech'],['+3.7%','Rise for the sector, calculated from Nasscom figures']],stand:'A firm can raise its revenue per head by selling higher-value work, by using people more fully, by cutting people or by using tools that do some of the work. Revenue per head cannot tell these apart.',sections:[
{k:'The rise',h2:'Revenue per employee rose 3 to 4% at the large firms in FY26',body:'<p>A press analysis reports that revenue per employee rose 3.4% at TCS and 4.1% at HCLTech in FY26, and in a 3 to 4% range at Infosys. Wipro\'s fell. The analysis does not say how revenue per employee was computed, or whether it used year-end or average headcount.</p>'+f('n2_firms','<b>Chart 2.1</b> · Rise in revenue per employee, FY26, two large firms and the sector.','Press analysis of FY26 results as reported by Angel One; sector figure calculated from Nasscom estimates.','rep','Revenue per employee rose 3 to 4%')+f('n2_rpe','<b>Chart 2.2</b> · Revenue per employee, sector, $ thousand.','Calculated from Nasscom revenue and employee estimates reported in February 2026.','derived')},
{k:'TCS',h2:'TCS earned 3.4% more per employee while shrinking its workforce 3.9%',body:'<p>TCS ended FY26 with 584,519 employees, 23,460 fewer than a year before. Both can be true when revenue is flat or rising and the workforce falls.</p>'+f('n2_tcs','<b>Chart 2.3</b> · Change in TCS revenue per employee and in headcount, FY26.','Press analysis of FY26 results; TCS headcount at 31 March 2026 and 2025 as reported by Entrepreneur India (584,519 and 607,979).','rep','Productivity up, headcount down')},
{k:'The limit',h2:'A decade of revenue per employee by firm is not in this edition',body:'<p>The plan for this book called for a decade of revenue per employee for the five largest firms, from annual reports. We have not yet read those reports, and a series built from press summaries would not be reliable. The appendix lists it as the first addition for the next edition.</p>'}],
contested:[['"About 2%"','The press analysis says TCS\'s workforce fell about 2%. Year-end figures give 3.9%. The 2% may refer to a different base.'],['Causes','A rise in revenue per head does not show that AI tools are responsible. Pricing, mix of work, currency and cuts all move it.'],['Definitions','The analysis does not say how revenue per employee was calculated for each firm.']],
takeaway:'Output per employee is rising, and at the largest firm it rose while the workforce fell. This is a fact about the firms and not yet a fact about AI.'},

3:{kicker:'Chapter 3 · Part 1: The Engine',title:'The Fresher Pipeline',dek:'In 2021-22 India filled 14 lakh engineering places and left 11 lakh empty. Three large employers hired about 71,500 freshers in FY26.',stats:[['14.1 lakh','B.Tech students enrolled in 2021-22, the latest year in the AICTE data we found'],['11.3 lakh','Approved B.Tech seats left vacant that year'],['71,500+','Freshers hired by TCS, Infosys and Wipro together in FY26']],stand:'The engineering colleges feed the technology firms. This chapter sets the two sides next to each other with the data that exists, which is thin and, for the colleges, old.',sections:[
{k:'Supply',h2:'More than 11 lakh B.Tech seats a year go empty',body:'<p>AICTE data, as reported by Careers360, show 25.4 lakh approved B.Tech seats in 2021-22 and 14.1 lakh students enrolled, which leaves 11.3 lakh seats vacant. The vacancy has been above 9.8 lakh in each of the three years reported.</p>'+f('n3_funnel','<b>Chart 3.1</b> · B.Tech seats, enrolment and campus placements, 2021-22, lakh.','AICTE data as reported by Careers360. Placed means placed through campuses and is not the number graduating.','rep','Of 25 lakh seats, 14 lakh were filled and 6 lakh students were placed')+f('n3_vacant','<b>Chart 3.2</b> · Vacant B.Tech seats, lakh.','AICTE data as reported by Careers360.','rep')+f('n3_placed','<b>Chart 3.3</b> · B.Tech students placed, lakh.','AICTE data as reported by Careers360.','rep')},
{k:'Demand',h2:'Three firms hired about 71,500 freshers in FY26. TCS hired six times as many as Wipro',body:'<p>TCS hired over 44,000 freshers in FY26. Infosys hired more than 20,000. Wipro onboarded about 7,500, below the 10,000 to 12,000 it had projected.</p>'+f('n3_firms','<b>Chart 3.4</b> · Freshers hired in FY26 by three large firms, thousand.','Business Today (TCS); Outlook Business (Infosys); The Peoples Board (Wipro).','rep','Freshers hired in FY26')},
{k:'Direction',h2:'The stated plans for FY27 are flat or lower',body:'<p>Infosys expects at least 20,000 freshers in FY27, the same as FY26. TCS had made 25,000 fresher offers so far for FY27 — a count of offers made by April, not a final target. Wipro declined to share a campus hiring outlook. HCLTech hired 5,196 freshers in July to September 2025 and 2,852 in October to December, 45% fewer.</p>'+f('n3_plan','<b>Chart 3.5</b> · Freshers hired in FY26 and the number stated for FY27, thousand.','Business Today, Outlook Business. TCS\'s FY27 figure is offers made by April 2026, not a target.','rep')+f('n3_hcl','<b>Chart 3.6</b> · Freshers hired by HCLTech in two quarters of FY26.','Storyboard18 on HCLTech\'s Q3 FY26 results.','rep')}],
contested:[['"Placed"','AICTE counts students placed in a year. The tables should not be read as a placement rate (see {ch:10}).'],['Old data','The AICTE figures are for 2021-22. A current table is the first thing the colleges side of this book needs.'],['Fresher counts','Each firm defines a fresher its own way. The three counts are not strictly comparable.']],
takeaway:'The colleges supply far more than the largest employers take. The largest employers\' fresher intake for FY27 is not yet rising, though firms say it depends on demand.'},

4:{kicker:'Chapter 4 · Part 1: The Engine',title:'Entry-Level Openings Fell 44% in a Month, and 11% in Another',dek:'A staffing firm\'s count of openings for people with up to two years of experience was 44% lower in June 2026 than a year earlier. In April it had been 11% lower.',stats:[['10,000','Entry-level tech openings in June 2026, down from 13,000 in May'],['−44%','Change on June 2025'],['−11%','Change on April 2025']],stand:'The 44% figure is the most quoted number about young people and tech jobs in India. It is real, it comes from one staffing firm, and it describes one month. This chapter reads it with its neighbours.',sections:[
{k:'The count',h2:'Entry-level openings fell from about 15,000 in April to 10,000 in June 2026',body:'<p>Xpheno, a specialist staffing firm, publishes a monthly count of active tech openings in India. It defines entry level as up to two years of experience. It counted about 15,000 entry-level openings in April 2026, 13,000 in May and 10,000 in June.</p>'+f('n4_entry','<b>Chart 4.1</b> · Active entry-level tech openings, thousand.','Xpheno Active Tech Jobs Outlook, as reported by YourStory (April 2026) and People Matters (May and June 2026).','rep','Entry-level openings, April to June 2026')},
{k:'The change',h2:'The year-on-year fall was 11% in April and 44% in June',body:'<p>The 44% fall is the June figure against June 2025. The April figure was an 11% fall. Working back from the 44% fall, June 2025 had about 17,900 entry-level openings.</p>'+f('n4_yoy','<b>Chart 4.2</b> · Change in entry-level openings on the same month a year earlier.','Xpheno, as reported by YourStory (April) and People Matters (June).','rep','The fall was 11% in April and 44% in June')+f('n4_implied','<b>Chart 4.6</b> · Entry-level openings in June 2025 (implied) and June 2026, thousand.','Implied June 2025 count calculated from the reported 44% fall; June 2026 as reported by People Matters.','derived')},
{k:'The whole',h2:'All tech openings were at a 28-month low in June and rose 14% by July',body:'<p>Across all experience bands, Xpheno counted about 103,000 active openings in January 2026, 93,000 in June, a 28-month low, and 106,000 in July. July was 14% above June and 8% below July 2025.</p>'+f('n4_total','<b>Chart 4.3</b> · All active tech openings, thousand.','Xpheno, as reported by Storyboard18 (January), People Matters (June) and Deccan Herald (July).','rep','All tech openings, 2026')+f('n4_total_yoy','<b>Chart 4.4</b> · Change in all active tech openings on a year earlier.','Xpheno, as reported by Storyboard18, YourStory and Deccan Herald.','rep')+f('n4_mix','<b>Chart 4.5</b> · Active tech openings by experience band, June 2026, thousand.','Xpheno, as reported by People Matters; the middle bar is calculated.','rep')}],
contested:[['One firm','Xpheno counts the openings it can see. Its count of openings is not a count of hires.'],['Month to month','The entry-level count moved from 15,000 to 10,000 in two months and total openings rose 14% in July. A single month is not a trend.'],['Why','None of the reports say why openings fell. Weak demand, a change in recruiting practice and AI tools are all possible.']],
takeaway:'Entry-level openings are lower than a year ago, by a large amount in one month and a small amount in another. The honest statement is that they are down, and that nobody yet measures by how much.'},

5:{kicker:'Chapter 5 · Part 1: The Engine',title:'TCS Shrinks',dek:'The country\'s largest private employer of graduates ended FY26 with 23,460 fewer people. Its peers grew.',stats:[['−23,460','Change in TCS headcount in FY26, to 584,519'],['+5,016','Change at Infosys, to 328,594'],['+8,810','Change at Wipro, to 242,156']],stand:'One firm\'s fall is not a sector trend. But the firm is the biggest, and the fall was larger than it announced.',sections:[
{k:'The fall',h2:'TCS lost 23,460 people in a year. Infosys and Wipro added',body:'<p>TCS had 607,979 employees at the end of March 2025 and 584,519 at the end of March 2026, a fall of 23,460 or 3.9%. Infosys ended FY26 with 328,594 employees, up 5,016. Wipro had 242,156, up 8,810.</p>'+f('n5_abs','<b>Chart 5.1</b> · Change in headcount, FY26, employees.','Company results as reported by Entrepreneur India (TCS, Infosys), Business Today (Wipro).','rep','TCS lost 23,460 employees while Infosys and Wipro added')+f('n5_pct','<b>Chart 5.2</b> · Change in headcount, FY26, per cent.','Calculated from the figures in Chart 5.1.','derived')+f('n5_level','<b>Chart 5.3</b> · Employees at the end of FY26.','Company results as reported by Entrepreneur India. HCLTech is the March quarter figure.','rep')},
{k:'The plan',h2:'TCS had said it would cut about 12,000. The headcount fell by almost twice that',body:'<p>In July 2025 TCS announced a phased restructuring that would cut about 2%, or some 12,000, of its workforce. A press report puts TCS\'s restructuring expense at ₹1,268 crore for the year. We have not read TCS\'s own account of how the fall divides between exits it initiated, resignations and slower hiring.</p>'+f('n5_plan','<b>Chart 5.4</b> · Cut announced by TCS in July 2025 and actual fall in FY26 headcount.','The Wire, 10 April 2026; headcount from Entrepreneur India.','rep','The fall was nearly twice the cut announced')},
{k:'The segment',h2:'Demand for IT services workers is lower than a year ago',body:'<p>Xpheno counted about 41,000 openings at IT services firms in January 2026, 18% fewer than a year earlier. In July 2026 it reported IT services demand 22% below the year before. During the same period openings at capability centres were up. That is the subject of {ch:7}.</p>'+f('n5_services','<b>Chart 5.5</b> · Change in tech openings at IT services firms on a year earlier.','Xpheno, as reported by Storyboard18 (January 2026) and Deccan Herald (July 2026).','rep')}],
contested:[['Peers','Infosys fell 8,440 in the March quarter after six quarters of growth, and its CFO said it was up about 5,000 on the year.'],['Why TCS','The reports describe a restructuring. They do not tie it to AI.'],['Wipro','Two press reports give different March 2025 figures for Wipro. We use the later report, which gives both endpoints.']],
takeaway:'The biggest firm shrank more than it said it would, while two peers grew. Whatever caused it, TCS is no longer a sure source of new jobs for a graduate.'},

6:{kicker:'Chapter 6 · Part 2: The Other Sectors',title:'Back Office and BPO: Clerical Work Is the Most Exposed',dek:'The ILO\'s index finds clerical occupations the most exposed to generative AI. India has no published series that says how many such jobs there are or whether hiring has changed.',stats:[['1 in 4','Workers in an occupation with some exposure to generative AI, ILO global estimate'],['3.3%','Share of global employment in the highest-exposure group'],['None found','Published series on hiring in India\'s customer support and business process work']],stand:'If a squeeze reaches back offices first, the exposure studies say why. The employment series that would show it does not yet exist in a form we could find.',sections:[
{k:'The finding',h2:'One in four workers is in a job with some exposure. 3.3% are in the most exposed group',body:'<p>The ILO\'s Working Paper 140, published in May 2025, refines an earlier index of how exposed each occupation is to generative AI. It sorts occupations into four gradients. One in four workers worldwide is in an occupation with some exposure. 3.3% of global employment is in the highest gradient. Clerical occupations have the highest exposure of any group.</p>'+f('n6_global','<b>Chart 6.1</b> · Share of global employment with some exposure to generative AI, and in the highest gradient.',ILO,'primary','One worker in four has some exposure; one in thirty is in the highest group')},
{k:'The meaning',h2:'Exposure measures tasks that could be automated. It does not measure jobs lost',body:'<p>The ILO is careful about this. Exposure is a score of the potential to automate tasks. Most occupations still need human input, and the likeliest effect the ILO describes is transformation of jobs, not their replacement.</p>'},
{k:'Income',h2:'Exposure is higher where wages are higher: 34% of employment in rich countries, 11% in poor ones',body:'<p>The ILO finds that 34% of employment in high-income countries is exposed to some degree, against 11% in low-income countries. India is a middle-income country and the paper\'s summary page does not give its figure.</p>'+f('n6_income','<b>Chart 6.2</b> · Share of total employment exposed, by country income group.',ILO,'primary','Exposure is three times higher in rich countries')},
{k:'The gap',h2:'India\'s back-office hiring is not published',body:'<p>Nasscom reports the IT-BPM industry as a whole. In the sources we read, we found no public series for hiring in customer support, transaction processing or other business process work separately. The measure proposed in {ch:13} includes a placeholder for it.</p>'}],
contested:[['Exposure and loss','An exposure score is not a forecast. An occupation can be highly exposed and still grow, if demand grows enough.'],['India','The ILO\'s global and income-group shares do not give an India figure. We do not estimate one.'],['Date','The index was published in 2025, and the tools it describes have changed since.']],
takeaway:'Clerical work is where the exposure studies point first. The data to check whether it is happening in India is not there.'},

7:{kicker:'Chapter 7 · Part 2: The Other Sectors',title:'Capability Centres Are Growing. Whether They Hire Freshers Is Unclear',dek:'India has more than 1,800 global capability centres employing 1.9 million people. About one in five of their staff is entry level.',stats:[['1,800+','Global capability centres in India'],['19 lakh','People employed in them'],['20 to 22%','Share of GCC staff at entry level']],stand:'Centres run by foreign companies in India are a growing source of tech work. If IT services hire fewer freshers, centres could take up some of the slack, or hire at the same low rate.',sections:[
{k:'Growth',h2:'More than 220 new centres opened in two years, a 14% rise',body:'<p>A TeamLease report, as covered by Storyboard18, counts over 1,800 centres employing about 1.9 million people. It says over 220 centres were added between FY23 and FY25, a 14% rise. The same report expects 2.8 to 4 million more jobs by FY30.</p>'+f('n7_count','<b>Chart 7.1</b> · Global capability centres in India.','TeamLease report as covered by Storyboard18, 12 November 2025. The FY23 figure is calculated from the 14% rise.','rep','Over 1,800 centres, 14% more than two years earlier')+f('n7_target','<b>Chart 7.2</b> · GCC workforce today and in FY30 on the report\'s expectation, million.','TeamLease, as covered by Storyboard18. The FY30 totals add the expected jobs to today\'s 1.9 million.','derived')},
{k:'Staff',h2:'About one in five centre staff is entry level; three in four are mid-level',body:'<p>The report puts entry-level staff at 20 to 22% of a centre\'s workforce, mid-level specialists at 75 to 77% and leaders at about 2.5%. The pyramid is therefore flatter than an IT services firm\'s, which depends on a broad base of freshers.</p>'+f('n7_mix','<b>Chart 7.3</b> · Share of GCC workforce by level, per cent (midpoints of reported ranges).','TeamLease report as covered by Storyboard18.','rep','Centres have a thin entry level')},
{k:'Openings',h2:'Centre openings rose 7% in a year while IT services openings fell 18%',body:'<p>Xpheno\'s January 2026 count found centre openings up 7% on January 2025 and IT services openings down 18%. That is one month, and the report does not split the centre openings by experience.</p>'+f('n7_vs','<b>Chart 7.4</b> · Change in active tech openings, January 2026 on January 2025.','Xpheno, as reported by Storyboard18.','rep')}],
contested:[['Source','The only GCC figures we found are from a staffing firm\'s report. Nasscom and Zinnov also publish a series, which we could not read in the original.'],['Ranges','The report gives ranges. The chart uses midpoints, and the shares sum to 99.5%.'],['Fresher hiring','The 20 to 22% is a share of the workforce, not of hiring. We found no count of freshers actually hired by centres.']],
takeaway:'Centres are growing, and they are one place where new tech jobs are appearing. They are built on experienced staff, so they will not replace the fresher intake that IT services provided.'},

8:{kicker:'Chapter 8 · Part 2: The Other Sectors',title:'Finance, Media, Law, Design: The Exposure Is Highest for Educated Work',dek:'The IMF estimates that 60% of jobs in rich countries and 40% in emerging markets are exposed to AI. Whether any of that shows in Indian hiring is not yet measured.',stats:[['60%','Jobs exposed to AI in advanced economies, IMF'],['40%','Emerging markets'],['54.8%','Urban women workers with a regular wage or salary job, April to June 2026']],stand:'The other white-collar fields have no hiring series that we could find. What there is are exposure studies, which say where the pressure could come, and labour survey figures on who holds salaried work.',sections:[
{k:'Exposure',h2:'Roughly 40% of jobs worldwide are exposed to AI. The share is higher the richer the country',body:'<p>The IMF\'s staff note of January 2024 estimates that almost 40% of global employment is exposed to AI, about 60% in advanced economies, 40% in emerging markets and 26% in low-income countries. The note adds that exposure is not the same as harm: some exposed jobs gain from AI.</p>'+f('n8_imf','<b>Chart 8.1</b> · Share of employment exposed to AI, by group of economies.','IMF Staff Discussion Note 2024/001, Gen-AI: Artificial Intelligence and the Future of Work, January 2024.','primary','Exposure is higher in richer economies')+f('n8_comp','<b>Chart 8.2</b> · Exposed employment split by whether AI is likely to complement or replace the work.','IMF Staff Discussion Note 2024/001.','primary')},
{k:'Who is salaried',h2:'In Indian cities more than half of working women hold a regular wage or salaried job',body:'<p>In April to June 2026, 54.8% of urban women workers had a regular wage or salaried job, and 47.5% of urban men. In rural areas the shares were 12.0% for women and 18.3% for men.</p>'+f('n8_wage','<b>Chart 8.3</b> · Regular wage or salaried workers as a share of workers aged 15 and over, April to June 2026.',PLFS,'primary','Urban women are more often salaried than urban men')},
{k:'The gap',h2:'No hiring series exists for finance, media, law or design',body:t(['Field','Exposure studies','Hiring series found','What is missing'],[['Finance and accounting','ILO and IMF cover clerical and professional groups','None','Openings and entry hiring by employer type'],['Media and publishing','Covered in the same groups','None','Newsroom and agency hiring'],['Law','Covered in the same groups','None','Junior associate hiring, by firm size'],['Design','Covered in the same groups','None','Freelance and in-house demand']],[],640)}],
contested:[['Exposure for India','The IMF figures are group averages. We have not verified an India-specific figure.'],['Direction','Exposure and complementarity do not decide whether employment rises or falls.'],['Salaried share','The salaried share is for all workers aged 15 and over, including those who do not work in offices.']],
takeaway:'Educated, salaried, urban work is where exposure is highest. India\'s data cannot yet say whether hiring in those fields has changed.'},

9:{kicker:'Chapter 9 · Part 3: The People',title:'Young Indians Are Finding Work Harder to Get',dek:'In April to June 2026, 15.9% of 15- to 29-year-olds in the labour force were without work, up from 14.6% a year earlier. For young women the rate was 19.6%.',stats:[['15.9%','Youth unemployment, April to June 2026, up 1.3 points'],['19.6%','Young women, up 3.6 points'],['9.9%','Youth unemployment on the annual usual-status measure, 2025']],stand:'The plan asked for a graduate unemployment rate. The official quarterly bulletin and annual press note do not publish one. This chapter uses the youth rate, which they do, and says what is missing.',sections:[
{k:'The rate',h2:'Youth unemployment rose 1.3 points in a year to 15.9%',body:'<p>The PLFS quarterly bulletin measures unemployment on a current weekly status basis. For people aged 15 to 29 it was 15.9% in April to June 2026, against 14.6% a year earlier. Rural youth unemployment rose 1.6 points to 14.7% and urban 0.3 points to 18.2%.</p>'+f('n9_cws','<b>Chart 9.1</b> · Unemployment rate, ages 15 to 29, current weekly status.',PLFS,'primary','Youth unemployment rose in rural and urban India')+f('n9_sex','<b>Chart 9.2</b> · Unemployment rate, ages 15 to 29, by sex.',PLFS,'primary')},
{k:'The annual view',h2:'On the annual measure the youth rate was 9.9% in 2025, down from 10.3%',body:'<p>The annual report uses a different measure, usual status, and a different survey design for 2025. Youth unemployment was 9.9% in 2025 and 10.3% in 2024. The document warns the 2025 figures may not be strictly comparable with earlier years. It reports a rate of 6.5% for people with secondary education or above, against 7.0% in 2024. It gives no rate for graduates.</p>'+f('n9_annual','<b>Chart 9.3</b> · Unemployment rate, ages 15 to 29, usual status.','MoSPI, PLFS Annual Report 2025, press note, Key findings.','primary','On the annual measure youth unemployment edged down')+f('n9_ladder','<b>Chart 9.4</b> · Unemployment rate by group, 2025, usual status.','MoSPI, PLFS Annual Report 2025, press note.','primary')},
{k:'Participation',h2:'Only 21% of young women are in the labour force',body:'<p>A low unemployment rate can hide people who are not looking. In April to June 2026, 60.4% of men aged 15 to 29 were in the labour force and 21.0% of women. The unemployment rate counts only those in the labour force.</p>'+f('n9_lfpr','<b>Chart 9.5</b> · Labour force participation rate, ages 15 to 29, April to June 2026.',PLFS,'primary','Participation is three times higher for young men')}],
contested:[['Two measures','The quarterly 15.9% and the annual 9.9% are not a trend. They differ in how a person is classified and in period. {ch:12} explains.'],['Graduates','The rate for graduates is the figure this book most wanted. We read the bulletin and the annual press note and did not find it.'],['Tech link','Nothing here ties youth unemployment to technology hiring. Most unemployed young people are not seeking tech work.']],
takeaway:'Young Indians face a harder job market than a year ago, especially young women. The data do not show how much of it is tech, or how graduates fare.'},

10:{kicker:'Chapter 10 · Part 3: The People',title:'Which Colleges, Which States: The Placement Table Cannot Be Read as a Rate',dek:'Tamil Nadu has 2.5 lakh B.Tech seats. In the AICTE table, more students are recorded as placed than graduated in three places.',stats:[['2.5 lakh','B.Tech seats in Tamil Nadu in 2021-22, the most of any state'],['52.5%','Share of Uttar Pradesh\'s seats that were filled, the lowest of seven states'],['+30% / −50%','Change in tech openings in small cities and in megacities, January 2026']],stand:'The plan asked for placement by college tier and a map of cities that depend on tech jobs. Neither exists in a public table we could read. This chapter shows what does exist, which is the geography of seats, and why the placement figures are not usable as they stand.',sections:[
{k:'Seats',h2:'Tamil Nadu alone approves about one B.Tech seat in ten',body:'<p>AICTE intake in 2021-22 was 2.51 lakh in Tamil Nadu, 1.49 lakh in Andhra Pradesh, 1.36 lakh in Maharashtra, 1.12 lakh in Telangana, 1.10 lakh in Karnataka, 85,000 in Uttar Pradesh and 50,000 in Kerala. These are the seven states in the reporting we found. The data are four years old.</p>'+f('n10_intake','<b>Chart 10.1</b> · Approved B.Tech intake by state, thousand, 2021-22.','AICTE data as reported by Careers360.','rep','Tamil Nadu approves the most B.Tech seats')+f('n10_fill','<b>Chart 10.2</b> · Share of approved seats filled, 2021-22.','Calculated from AICTE intake and enrolment as reported by Careers360.','derived','Fewer than six in ten seats were filled in Kerala and Uttar Pradesh')},
{k:'Placement',h2:'In three places the table records more students placed than graduated',body:'<p>The AICTE table pairs graduates and students placed in 2021-22. In Telangana placed divided by graduates is 108%, in Kerala 120% and in Delhi 130%. The placement count may include students who graduated in other years. Whatever the cause, the figure cannot be read as a placement rate for a given class.</p>'+f('n10_placed','<b>Chart 10.3</b> · Students placed as a share of graduates, 2021-22.','Calculated from AICTE data as reported by Careers360.','derived','In three places more students were recorded as placed than graduated')},
{k:'Cities',h2:'Openings in megacities fell nearly 50% in a year while small cities rose 30%',body:'<p>Xpheno\'s January 2026 report found tech demand in megacities down nearly 50% on a year earlier and in tier-2 and tier-3 cities up 30%. The report does not name the cities or give the counts.</p>'+f('n10_city','<b>Chart 10.4</b> · Change in active tech openings by city size, January 2026 on January 2025.','Xpheno, as reported by Storyboard18.','rep')}],
contested:[['Old data','The state tables are for 2021-22. They show geography, not the effect of recent hiring.'],['No tier data','We found no public placement data by NIRF rank or college tier.'],['Coverage','The reporting covers seven states and Delhi. We do not know why other states are missing.']],
takeaway:'The one placement table that exists cannot say who gets hired. A state-level and college-level placement series is the missing piece.'},

11:{kicker:'Chapter 11 · Part 3: The People',title:'Women and First Jobs',dek:'Women are 37% of the tech workforce and were 48% of its net additions in FY23. In the EPFO payroll for July 2025 they were 21% of the net additions.',stats:[['37%','Women\'s share of the tech workforce, FY23 (calculated)'],['21%','Women\'s share of net EPFO payroll additions, July 2025 (calculated)'],['4.7% / 2.4%','Women and men in the highest-exposure group, ILO']],stand:'Where the squeeze comes, it may not come equally. Three sources point the same way: women are more exposed, face higher youth unemployment and are less often on new payrolls.',sections:[
{k:'Tech',h2:'Women are about 37% of the tech workforce and took 48% of FY23\'s new jobs',body:'<p>Nasscom\'s 2023 review put women at about 2 million of the workforce and said they accounted for over 140,000 of the 290,000 net additions. Calculated, those are 37% of the workforce and 48% of the additions. The figures are for FY23, the last year in which we read Nasscom\'s own release.</p>'+f('n11_nasscom','<b>Chart 11.1</b> · Women\'s share of the tech workforce and of FY23 net additions.','Nasscom Strategic Review 2023, press release. Shares calculated.','derived','Women took nearly half of the new jobs in FY23')},
{k:'Payrolls',h2:'In July 2025 women were 29% of new EPFO members and 21% of net additions',body:'<p>The EPFO reported 21.04 lakh net payroll additions in July 2025, of which about 4.42 lakh were women. Of 9.79 lakh new members, 2.80 lakh were women.</p>'+f('n11_epfo','<b>Chart 11.2</b> · Women\'s share of new EPFO members and of net payroll additions, July 2025.','Ministry of Labour and Employment, PIB release on EPFO payroll data for July 2025. Shares calculated.','derived','Women are a smaller share of new formal payrolls than of the tech workforce')},
{k:'Unemployment',h2:'Young urban women face a 25.2% unemployment rate, against 16.0% for young urban men',body:'<p>In April to June 2026 the youth unemployment rate was 19.6% for women and 14.5% for men. In cities it was 25.2% for women and 16.0% for men. Women\'s rate rose 3.6 points in a year and men\'s 0.4.</p>'+f('n11_ur','<b>Chart 11.3</b> · Unemployment rate, ages 15 to 29, by sex and area, April to June 2026.',PLFS,'primary','The gap is widest in cities')},
{k:'Exposure',h2:'The ILO finds women twice as likely as men to be in the highest-exposure group',body:'<p>The ILO finds 4.7% of women\'s employment in the highest gradient against 2.4% of men\'s worldwide. In high-income countries the figures are 9.6% and 3.5%.</p>'+f('n11_ilo','<b>Chart 11.4</b> · Share of employment in the highest exposure gradient, by sex.',ILO,'primary')}],
contested:[['Different bases','The Nasscom figures are for the tech sector in FY23, the EPFO figures for all formal employers in one month, and the PLFS figures for all young people. They do not form one series.'],['Causes','These sources do not say why women\'s unemployment rose more. We do not claim a link with technology.'],['The reason','We have not tested the clerical-work explanation for India.']],
takeaway:'Where the first jobs go, women hold fewer of them than they did in the tech workforce. The numbers should be watched by sex from the start.'},

12:{kicker:'Chapter 12 · Part 4: The Measure',title:'What India Counts Today, and What It Misses',dek:'Five sources touch the question. Each counts something different, and none counts the first job of a graduate.',stats:[['5','Sources compared in this chapter'],['15.9% and 9.9%','Youth unemployment from two official measures in two periods'],['0','Sources found that publish graduate unemployment, entry-level hiring and fresher wages together']],stand:'Part III showed the pieces. This chapter lays the sources side by side, because the case for a new measure rests on what the existing ones leave out.',sections:[
{k:'The sources',h2:'Each source counts a different thing',body:t(['Source','What it counts','How often','What it misses'],[['PLFS quarterly bulletin (MoSPI)','Unemployment, participation and employment status by age, sex and area','Quarterly, with an annual report','No graduate rate in the documents we read; no sector or occupation of the first job'],['EPFO payroll data (Ministry of Labour)','Net additions to formal provident fund payrolls, with age and sex','Monthly','Only formal jobs; does not say whether a member is a first-time employee or a graduate; no sector split in the release we read'],['Nasscom Strategic Review','Revenue and employees of the technology industry','Annual, with an estimate in February','Net additions only; no gross hiring, freshers or attrition; revises past years'],['Xpheno Active Tech Jobs Outlook','Active openings in tech, by experience band and employer type','Monthly','One firm\'s view of openings; not hires; tech only'],['AICTE data (as reported)','Seats, enrolment, graduates and placements in technical colleges','Annual, published with a lag','The latest year we found is 2021-22; the placement figures cannot be read as a rate']],[],860)},
{k:'Two measures',h2:'The same young people look like 15.9% unemployed or 9.9% unemployed',body:'<p>The quarterly bulletin uses the current weekly status and gave 15.9% for ages 15 to 29 in April to June 2026. The annual report uses the usual status and gave 9.9% for calendar 2025. The two are not a before and after. They count differently and cover different periods.</p>'+f('n12_two','<b>Chart 12.1</b> · Youth unemployment rate (15 to 29) on two official measures.','MoSPI, PLFS Quarterly Bulletin April to June 2026; PLFS Annual Report 2025 press note.','primary','Two official measures, two answers')+f('n12_wage','<b>Chart 12.4</b> · Regular wage or salaried workers, per cent of workers, usual status.','MoSPI, PLFS Annual Report 2025 press note, Highlight 4.','primary')},
{k:'Payrolls',h2:'The EPFO shows who joins a payroll, but not whether it is a first job',body:'<p>For July 2025 the EPFO added 21.04 lakh net members. It reported 9.79 lakh new members, of whom 5.98 lakh, or 61.06%, were aged 18 to 25. The figures are provisional and are revised each month.</p>'+f('n12_epfo','<b>Chart 12.2</b> · New EPFO members in July 2025, all ages and aged 18 to 25, lakh.','Ministry of Labour and Employment, PIB release on EPFO payroll data for July 2025.','primary','Six in ten new payroll members are 18 to 25')+f('n12_net','<b>Chart 12.3</b> · Net EPFO payroll additions in July 2025, lakh.','Ministry of Labour and Employment, PIB release on EPFO payroll data for July 2025.','primary')}],
contested:[['Comparability','Do not read the move from 15.9% to 9.9% as an improvement. They are different measures.'],['"Graduate"','We have not used PLFS unit-level data, in which an education field exists. A graduate rate might be computed there.'],['The EPFO','The release is for one month, July 2025.']],
takeaway:'The existing sources are good at what they count. None counts a graduate\'s first job.'},

13:{kicker:'Chapter 13 · Part 4: The Measure',title:'The Entry-Level Jobs Indicator',dek:'A quarterly panel of nine indicators for the first rung of the ladder. Seven have a value today. Two are pending because no source exists.',stats:[['7 of 9','Indicators with a value today'],['2 of 9','Pending: graduate unemployment and wage offers to freshers'],['Quarterly','Proposed update rhythm']],stand:'This is the part of the book that is meant to be updated. Each row has a value, a date, a change and an evidence tag. A row with no source stays pending and shows no number.',sections:[
{k:'The panel',h2:'Seven of nine indicators have a value. Four of the seven are press-reported',body:'<p>The panel brings together the sources of Part I to Part III. Three rows are Primary: read from MoSPI and the EPFO releases. Four are Reported. The pending rows are the two the book most wanted: unemployment among graduates, and wages offered to freshers.</p><div class="chart" data-chart="n13_panel" style="margin-top:8px"></div><p class="note" style="margin-top:4px">As at 20 October 2026.</p>'},
{k:'The design',h2:'Four questions and a method that is published',body:t(['Question','Indicator','Source it would use','Status'],[['Are firms opening entry-level roles?','Entry-level openings; freshers hired by the large firms','Job-portal counts; firm results','Values today, press-reported'],['Are graduates finding work?','Unemployment among graduates; youth unemployment; share of new payroll members aged 18 to 25','PLFS; EPFO','Youth and EPFO have values; graduate rate pending'],['Is the sector growing?','Net job additions; headcount change at the largest firms','Nasscom; company results','Values today, press-reported'],['Is the offer worth taking?','Wage offers to freshers','Employer or portal data','Pending; no source found']],[],760)+'<p style="margin-top:8px">Five rules apply to every row: a definition is published; the source and date are shown; a revised number is marked and not overwritten; a press-reported figure is replaced when the original is read; an indicator with no source is shown as pending.</p>'},
{k:'The rhythm',h2:'Updates follow the sources',body:'<p>Openings are monthly, payrolls are monthly, the PLFS bulletin is quarterly, firm results are quarterly and Nasscom reports once a year. A quarterly panel would take the latest value of each. It would be updated after the PLFS bulletin, which is the slowest of the regular sources.</p>'}],
contested:[['Choice','The Foundation chose these nine. A different panel could do as well.'],['Weights','The panel does not combine its rows into one index.'],['Press-reported rows','Four rows rest on press reports. They are marked and should be replaced by original releases.']],
takeaway:'The panel is a start. Seven values exist today, two are missing and the missing two are the ones that matter most to a graduate.'},

14:{kicker:'Chapter 14 · Part 4: The Measure',title:'The AI Exposure Map: A Method, Not Yet a Map',dek:'Which occupations and districts are most exposed to AI can be worked out by joining the ILO\'s occupation scores to the labour survey. We set out how, and what we have not yet done.',stats:[['4','Steps from occupation score to district exposure'],['0','District exposure figures in this edition'],['3','Inputs we have not obtained: ILO occupation scores, PLFS unit data, a crosswalk between the two classifications']],stand:'A map would be easy to draw and hard to defend. This chapter does the second job first: it states the assumptions, so the first can be done honestly.',sections:[
{k:'The method',h2:'Four steps turn a score for each occupation into a figure for each district',body:t(['Step','What is done','Input','Assumption to state'],[['1','Take the ILO exposure gradient for each occupation','ILO Working Paper 140 occupation scores (ISCO-08)','The ILO\'s scores for the world apply in India'],['2','Match ISCO occupations to India\'s occupation codes','A crosswalk to the National Classification of Occupations','One Indian occupation maps to one ISCO group'],['3','Count workers in each occupation by district','PLFS unit-level data','The survey sample is large enough for the district'],['4','Combine them into a district exposure share','Steps 1 to 3','Exposure is not job loss; it is a share of tasks']],[],780)+'<p style="margin-top:8px">Each step has a source of error. The result would be reported as a range, with a note on which assumption matters most.</p>'},
{k:'What exists',h2:'The global anchors we have are the ILO\'s and the IMF\'s',body:'<p>The ILO places one worker in four in an occupation with some exposure and 3.3% in the highest group ({ch:6}). The IMF places about 40% of world employment, and 40% of emerging-market employment, in exposed jobs ({ch:8}). We did not find an exposure figure for India in a primary source, and we have not made one.</p>'},
{k:'The caution',h2:'The map would show where the tasks are, not where the jobs will go',body:'<p>The ILO says the likeliest effect is the transformation of jobs. A district with a high exposure share is a district with many workers whose tasks could change. Whether they lose work depends on demand, on the firm and on what the worker can move to. The map should be read as a place to look.</p>'}],
contested:[['Not produced','This chapter has no chart because we would have had to invent the inputs. A made-up map would be read as a finding.'],['Classifications','ISCO-08 and India\'s NCO differ. A poor crosswalk changes the result.'],['District samples','The PLFS is designed for states. District estimates may be too noisy to publish.']],
takeaway:'The exposure map is a method with three missing inputs. Obtaining them is a defined task, and we list it as the first piece of work for the next edition.'},

15:{kicker:'Chapter 15 · Part 5: The Response',title:'What Other Countries and India Itself Have Tried',dek:'Three schemes pay for first jobs or for retraining. None comes with an evaluation we could read, so this chapter describes the designs and does not rank them.',stats:[['₹99,446 cr','Outlay of India\'s Employment Linked Incentive scheme'],['3.5 crore','Jobs it targets over two years, of which 1.92 crore are first-time employees'],['S$4,000','Singapore\'s mid-career SkillsFuture credit for citizens aged 40 and over']],stand:'The plan asked what worked. We found what the schemes do and what they cost. We did not find results, and say so.',sections:[
{k:'India: the incentive',h2:'India\'s ELI scheme pays first-time employees one month\'s wage and pays employers up to ₹3,000 a month',body:'<p>The Union Cabinet approved the Employment Linked Incentive scheme in July 2025. It has an outlay of ₹99,446 crore and targets more than 3.5 crore jobs over two years, of which about 1.92 crore are first-time employees. Part A pays a first-time EPFO-registered employee one month\'s wage, up to ₹15,000, in two instalments. Part B pays employers up to ₹3,000 a month for two years for each additional employee kept for at least six months.</p>'+f('n15_eli','<b>Chart 15.1</b> · Jobs targeted by the Employment Linked Incentive scheme, crore.','Ministry of Labour and Employment, PIB release of 1 July 2025.','primary','The scheme targets 3.5 crore jobs')+f('n15_eli_size','<b>Chart 15.2</b> · The most the scheme pays per employee, rupees.','PIB release of 1 July 2025; Part B total calculated as ₹3,000 for 24 months.','derived')},
{k:'India: the internship',h2:'The PM Internship pilot offered ₹5,000 a month for 12 months to 21- to 24-year-olds',body:'<p>The pilot for the PM Internship Scheme opened in October 2024. It paid ₹5,000 a month plus a one-time ₹6,000 for 12 months. It drew 1.55 lakh registrations in the first days against a pilot target of 1.25 lakh. We found no report of how many internships were accepted or led to jobs.</p>'+f('n15_pmi','<b>Chart 15.3</b> · PM Internship pilot: target and early registrations, lakh.','Outlook Business, 14 October 2024, reporting the Ministry.','rep')},
{k:'Abroad',h2:'Singapore pays mid-career workers to train; the UK charges a levy on large payrolls',body:t(['Scheme','Who is helped','How it works','Who pays','Results we found'],[['ELI (India, 2025)','First-time formal employees; employers who add staff','Cash to employee; monthly payment to employer','Government, ₹99,446 crore','None'],['PM Internship pilot (India, 2024)','Ages 21 to 24','Monthly stipend for a 12-month internship','Government and firms; pilot ₹800 crore','None found'],['SkillsFuture Level-Up (Singapore, 2024)','Citizens aged 40 and over','Credit, fee subsidy and training allowance','Government','None read'],['Apprenticeship Levy (UK)','Apprentices, through employers','0.5% levy on large pay bills, funds apprenticeships','Large employers','None read']],[],900)}],
contested:[['Results','We did not find an independent evaluation of any of the four.'],['Fit','None of the schemes was designed for a squeeze on graduate hiring in tech.'],['Latest status','The ELI and PM Internship descriptions are as announced. We have not checked take-up.']],
takeaway:'India already pays for first jobs. What the schemes achieved is not yet public, and the Foundation cannot tell whether they reach the graduates this book is about.'},

16:{kicker:'Chapter 16 · Part 5: The Response',title:'A Path for India: Options, Costs and Trade-offs',dek:'The Foundation lists options for firms, colleges and government. It does not choose among them.',stats:[['₹28,413','Outlay per targeted job in the ELI scheme (calculated)'],['₹64,000','Pilot budget per place in the PM Internship pilot (calculated)'],['9 months','Training a TCS fresher needs before working on projects, according to Business Today']],stand:'The options come from chapters 1 to 15. Each has a cost to someone and a trade-off. Where we have a figure for the cost we give it, and where we do not we say so.',sections:[
{k:'The options',h2:'Eight options, each with a cost to somebody',body:t(['Who acts','Option','Who bears the cost','Trade-off','What the book offers on it'],[['Firms','Publish fresher hiring, attrition and the level of entry roles each quarter','Firms (reporting cost)','Discloses hiring plans to competitors','Fresher counts are now reported ad hoc ({ch:3})'],['Firms','Create structured entry roles with training','Firms','Freshers take about nine months of training before projects','Business Today report on TCS'],['Colleges','Publish placement by graduating class and by programme','Colleges','Exposes weak programmes','Placement table cannot be read as a rate ({ch:10})'],['Colleges','Match intake to demand','Colleges and students','Closes seats and staff posts','Over 11 lakh seats vacant in 2021-22 ({ch:3})'],['Government','Publish graduate unemployment and the Entry-Level Jobs Indicator','Government statistical system','A new release to produce','{ch:13}'],['Government','Wage support for first jobs','Taxpayers','Pays for jobs that might have been created anyway','ELI scheme at ₹99,446 crore ({ch:15})'],['Government','Paid internships','Taxpayers and firms','Cost per place is high; the pilot has no reported results','PM Internship pilot ({ch:15})'],['Government','Mid-career credits and allowances for retraining','Taxpayers','Targets workers already hit, not those not yet hired','Singapore\'s programme ({ch:15})']],[],980)},
{k:'The costs',h2:'A rupee figure for each option exists only for two of the eight',body:'<p>The ELI scheme\'s outlay of ₹99,446 crore, divided by its target of 3.5 crore jobs, is about ₹28,400 per targeted job. The PM Internship pilot\'s estimated ₹800 crore, divided by its pilot target of 1.25 lakh, is ₹64,000 per place. The two numbers are not like for like.</p>'+f('n16_cost','<b>Chart 16.1</b> · Budget divided by target, two schemes, rupees.','Calculated from PIB (ELI) and Outlook Business (PM Internship pilot).','derived','Cost per targeted place differs more than twofold')},
{k:'The order',h2:'The Foundation puts measurement first because every other option needs it',body:'<p>Wage support, internships and retraining all depend on knowing whether hiring is falling, for whom and where. The panel in {ch:13} has two empty rows. Filling them needs no new law. It needs a decision by the agencies that hold the data to publish it.</p>'}],
contested:[['Not a ranking','The Foundation does not rank the options. The evidence in this book does not support a ranking.'],['Costs','Only two options have a rupee cost in this edition.'],['Order','Putting measurement first is a judgment, and the Foundation reasons for it above.']],
takeaway:'The options are many and the evidence on them is thin. What is plainly missing is the measure, and that is the cheapest thing on the list.'}
    };
    return d[n]||null;
  }

  buildEpilogue(){
    return '<article>'+this.chead('Epilogue','What to Watch Each Quarter','Five numbers, each with its source, its latest value and when it next moves.',this.stat('−44%','Entry-level openings, June 2026 on June 2025')+this.stat('15.9%','Youth unemployment, April to June 2026')+this.stat('71,500+','Freshers hired by TCS, Infosys and Wipro, FY26'),'The book is a picture of a moment. These five numbers are how to see whether it moves.')+
    this.sec('The five','Five numbers carry most of the story',this.tbl(['Number','Latest','Source','Next update','Read it as'],[['Entry-level tech openings, change on a year earlier','−44% (June 2026); −11% in April','Xpheno, monthly','Monthly','A fall in several months running would matter more than one month'],['Youth unemployment, 15 to 29','15.9% (April to June 2026)','MoSPI PLFS quarterly bulletin','Quarterly','Compare only with the same measure a year earlier'],['Freshers hired by the large firms','71,500+ (FY26, three firms)','Company results and press conferences','Each quarter','Watch TCS\'s FY27 count against 44,000'],['Net job additions in the sector','1.35 lakh (FY26)','Nasscom, annual','February','FY24 was 0.6 lakh; a figure near it would be a warning'],['Share of new payroll members aged 18 to 25','61.1% (July 2025)','EPFO payroll release','Monthly','A falling share would mean fewer young people entering formal work']],[],900)+'<p style="margin-top:8px">The values are in the panel at {ch:13}, which is updated when the sources change.</p>')+
    this.take('Entry-level hiring is where the squeeze would first show. These five numbers are the earliest places to see it.')+
    this.pager({k:'ch-16',dir:'Chapter 16',title:'A Path for India',ts:'Eight options. The Foundation does not rank them.'},{k:'appendix',dir:'Appendix',title:'Method, Sources and What Comes Next',ts:'Evidence tags, what we could not find and five additions for the next edition.'})+'</article>';
  }

  buildAppendix(){
    const t=this.tbl.bind(this);
    return '<article><header class="chead"><div class="kicker">Appendix</div><h1>Method, Sources and What Comes Next</h1><p class="dek">How the figures were gathered, what each evidence tag means and what we could not find.</p></header>'+
    this.sec('A','Evidence tags','<div style="display:flex;flex-direction:column;gap:8px"><p>'+this.tier('primary')+' The figure was read from the original release or document.</p><p>'+this.tier('derived')+' Our arithmetic on figures shown. The formula is in the chart\'s note.</p><p>'+this.tier('rep')+' A press report of a company, industry body or staffing firm release that we did not read in the original. Marked in every chart that uses it.</p><p>'+this.tier('illus')+' A worked example with stated assumptions. None in this edition.</p></div>')+
    this.sec('B','What we could not find','<p>Graduate unemployment rate; hiring in back offices, finance, media, law and design; placement by college tier; city-level dependence on tech; an India figure for AI exposure; independent evaluations of the schemes in chapter 15; wage offers to freshers.</p>')+
    this.sec('C','Revisions and conflicts between sources',t(['Item','What the sources say','What we did'],[['Nasscom FY25 revenue','$282.6 billion (February 2025); $297 billion (February 2026)','Used each as reported and said so'],['Nasscom FY26 net addition','About 1.35 lakh (Storyboard18); about 1.3 lakh (The Core, calculated)','Used 1.35 lakh'],['Wipro headcount, March 2025','233,232 and 233,346 in two reports','Used 233,346, from the report that gives both endpoints'],['TCS fall','"About 2%" in one analysis; 3.9% from year-end headcounts','Used year-end figures'],['Women in tech','A 2023 government-portal article gave a count inconsistent with its own figures','Used Nasscom\'s own 2023 release']],[],720))+
    this.sec('D','What comes next','<p>First, revenue per employee for the five largest firms over a decade, from annual reports. Second, the PLFS unit-level data, to compute a graduate unemployment rate. Third, the ILO occupation scores and a crosswalk to India\'s occupation codes, for the exposure map. Fourth, the originals of the Nasscom, GCC and Xpheno reports. Fifth, a review of evaluations of first-job and retraining schemes.</p>')+
    '<section class="sec"><div class="kicker">E · Sources</div><h2>Sources used in this edition</h2><ul class="sources"><li>MoSPI, Periodic Labour Force Survey, Quarterly Bulletin April to June 2026; PLFS Annual Report 2025, press note</li><li>Ministry of Labour and Employment, PIB: EPFO payroll data, July 2025; Employment Linked Incentive scheme, 1 July 2025</li><li>Nasscom Strategic Review 2023, press release; Nasscom estimates for FY24 to FY26 as reported by Outlook Business, YourStory, Storyboard18 and The Core</li><li>Xpheno Active Tech Jobs Outlook as reported by People Matters, YourStory, Storyboard18 and Deccan Herald</li><li>Company results as reported by Entrepreneur India, Business Today, Outlook Business, Storyboard18, The Wire, Angel One and The Peoples Board</li><li>AICTE data as reported by Careers360</li><li>TeamLease report on global capability centres, as covered by Storyboard18, 12 November 2025</li><li>ILO Working Paper 140, May 2025; IMF Staff Discussion Note 2024/001, January 2024</li><li>Singapore Ministry of Education press release, 4 March 2024; gov.uk, Pay the apprenticeship levy</li><li>Outlook Business, 14 October 2024, on the PM Internship pilot; news reports on Nasscom and TCS in chapter 13</li></ul></section>'+
    '<section class="sec"><div class="kicker">F · Corrections</div><h2>Corrections</h2><p>None yet. Corrections to published figures will be listed here with the date and what changed.</p></section>'+
    this.pager({k:'epilogue',dir:'Epilogue',title:'What to Watch Each Quarter',ts:'Five numbers and when they next move.'},null)+'</article>';
  }

  componentDidMount(){
    this._tip=document.getElementById('tip');
    const tog=document.getElementById('ttog');
    if(tog){const isDark=()=>document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&window.matchMedia('(prefers-color-scheme:dark)').matches);tog.textContent=isDark()?'☀':'☽';tog.addEventListener('click',()=>{const d=isDark();document.documentElement.setAttribute('data-theme',d?'light':'dark');tog.textContent=d?'☽':'☀';});}
    this._scroll=()=>{const d=document.documentElement,h=d.scrollHeight-d.clientHeight,p=document.getElementById('prog');if(p&&h>0)p.style.width=(d.scrollTop/h*100)+'%';};
    window.addEventListener('scroll',this._scroll,{passive:true});
    this._route=()=>this.renderPage();
    window.addEventListener('hashchange',this._route);
    this.renderPage();
  }
  componentWillUnmount(){window.removeEventListener('hashchange',this._route);window.removeEventListener('scroll',this._scroll);this._ro.forEach(o=>o.disconnect());this._ro=[];}

  renderPage(){
    this._ro.forEach(o=>o.disconnect());this._ro=[];this.hideTip();
    const key=(location.hash.replace(/^#\/?/,'')||'home');
    const k=this.PAGES[key]?key:'home';
    const main=document.getElementById('main');if(!main)return;
    main.innerHTML=this.buildPage(k);
    main.querySelectorAll('[data-chart]').forEach(h=>{const f=this.R[h.dataset.chart];if(f)f(h);});
    document.title=(this.PAGES[k]||'Home')+' · The AI Squeeze';
    document.querySelectorAll('.sitebar a[data-k]').forEach(a=>{if(a.dataset.k===k)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
    const prog=document.getElementById('prog');if(prog)prog.style.width='0%';
    window.scrollTo(0,0);main.focus({preventScroll:true});
  }

  renderVals(){return{};}
}
</script>
</body>
</html>
