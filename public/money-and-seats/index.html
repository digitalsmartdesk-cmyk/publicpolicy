  buildPrologue(){

    const CENSUS='Census of India 2011 populations, as compiled in Wikipedia';
    const SEATS='Lok Sabha seats by state, as compiled in Wikipedia';
    return '<article>'+this.chead('Prologue','Two Formulas, One Federation','India divides its tax money and its Parliament by formulas that both turn on population. They were never set out side by side.',this.stat('41%',"States' share of the divisible pool of central taxes for 2026 to 2031, unchanged from the 15th Commission")+this.stat('298 to 230','The Lok Sabha vote on 17 April 2026 on the constitutional amendment. It needed 352.')+this.stat('1971','The census on which each state\'s Lok Sabha seats are still based'),'In April 2026 Parliament was asked to change how seats are divided. A new Finance Commission formula for money was already in force. This book puts the two on the same page, state by state, and recommends neither.')+
    this.sec('The money','The 16th Finance Commission has set a new formula for sharing central taxes, for 2026 to 2031','<p>The Finance Commission recommends how the Centre\'s tax revenue is shared with the states. For 2026 to 2031 it kept the states\' share at 41% and changed the weights of the criteria used to divide it among them. Population in 2011 now carries 17.5%. A criterion called demographic performance, which rewards slower population growth between 1971 and 2011, carries 10%. Income distance carries the largest weight, 42.5%.</p>'+this.fig('m4_weights','<b>Chart P.1</b> · Weights of the criteria used to divide the states\' share of central taxes, 15th and 16th Finance Commissions.',FC+'.','comp','The weights moved, and one criterion is new'))+
    this.sec('The seats','Each state\'s number of Lok Sabha seats still rests on the 1971 Census','<p>The Constitution froze each state\'s seats at the 1971 Census in 1976, and extended the freeze in 2001 until the figures for the first census after 2026 are published. In that time India\'s population has more than doubled and the number of seats has not changed. On 16 April 2026 the Government introduced three Bills to end the freeze, raise the House to as many as 850 seats and use the 2011 Census. The key amendment was defeated the next day.</p>'+this.fig('m1_pps','<b>Chart P.2</b> · People per Lok Sabha seat, 1971 and 2011, lakh.','About 54.8 crore in 1971, as reported; 2011 population from the Census as compiled by Wikipedia; 543 seats. Calculated.','derived','Each seat now stands for more than twice as many people'))+
    this.sec('The gap','The two questions share a variable, and have so far been argued apart','<p>Seats follow population in one rule and money follows population in another. Both are formulas, and both are legitimate subjects of dispute. What the public record does not show is the two on one page. This book does the arithmetic and stops there. The Foundation takes no position on which rule is right.</p><p>Three terms are used throughout. A seat share is a state\'s seats as a fraction of the House. A money share is a state\'s portion of the divisible pool. A per-head index is the money share divided by the population share, so that 100 means an equal amount per person.</p>')+
    this.sec('The rules','This book makes no recommendation, and shows its working','<p>Every figure is tagged with how we know it. Where the Bills, the Commission or a government has said something, we say who said it. The review status of this edition is stated on the home page: the position summaries and the seat arithmetic have not yet been checked by a constitutional lawyer or by people who hold each view.</p><div class="review-note">⚠ No Indian figure in this edition is tagged Primary. We did not read the Census tables, the Finance Commission report or the Bill texts directly.</div>')+
    this.take('Seats and money both turn on population, but through different rules. The honest task is to show the numbers for each and let readers argue the values.')+
    this.pager(null,{k:'ch-1',dir:'Chapter 1',title:'One Person, One Vote: How Seats Were Set',ts:'India\'s Lok Sabha has been redrawn three times and then frozen.'})+'</article>';
  }

{k:'2001',h2:'The 84th Amendment extended the freeze until the first census after 2026',body:'<p>Article 81(3), as described in the accounts we read, keeps the 1971 basis for the number of seats in each state until "the relevant figures for the first census taken after the year 2026 have been published." The Delimitation Act, 2002 redrew boundaries within states on the 2001 Census.</p><p>The first census after 2026 is the 2027 Census. When its figures are published, the freeze lapses unless Parliament amends the Article again.</p>'},

takeaway:'The spread in people per seat is real and measured. What to do about it is a question of values.'},

4:{kicker:'Chapter 4 · Part 2: The Money Formula',title:'How Finance Commissions Work',dek:"Every five years or so a Finance Commission recommends how central taxes are shared with the states. The states' share has moved from 32% to 42% and back to 41%.",stats:[["41%","States' share of the divisible pool for 2021 to 2026 and 2026 to 2031"],["42%","14th Commission, 2015 to 2020"],["32%","13th Commission, before it"]],stand:'The Commission has two jobs in this book\'s story: how much of the pool goes to the states, and how the states\' share is divided among them. The second is where population enters.',sections:[
{k:'The pool',h2:"The states' share of the pool rose by ten points in 2015 and has changed by one point since",body:'<p>The 14th Commission raised the states\' share of the divisible pool from 32% to 42%. The 15th Commission set it at 41%, with the one point provided for the new union territories of Jammu and Kashmir and Ladakh. The 16th Commission kept 41% for 2026 to 2031. The report was tabled in Parliament on 1 February 2026.</p>'+f('m4_share','<b>Chart 4.1</b> · States\' share of the divisible pool of central taxes, per cent.','Business Today and Deccan Herald reports (32% and 42%); PRS summaries of the 15th and 16th Commissions (41%).','rep',"The states' share of the pool")},
{k:'The formula',h2:'The criteria changed between the 15th and 16th Commissions',body:'<p>The 15th Commission used six criteria: income distance (45%), area (15%), population in 2011 (15%), demographic performance (12.5%), forest and ecology (10%) and tax and fiscal efforts (2.5%). The 16th uses income distance (42.5%), population in 2011 (17.5%), demographic performance (10%), area (10%), forest (10%) and a new criterion, contribution to GDP (10%). Tax and fiscal efforts was dropped.</p>'+f('m4_weights','<b>Chart 4.2</b> · Weights of the criteria, 15th and 16th Finance Commissions, per cent.',FC+'.','comp')},
{k:'Per state',h2:'The 28 states\' shares are published to two decimal places by the Commission',body:'<p>Jammu and Kashmir is a union territory and is not in the formula. The shares of the 28 states for each Commission add to 100. Chapter 6 turns them into per-head terms. A share is not a rupee amount: the pool changes each year with tax collections.</p>'}],
contested:[['Source','We read PRS Legislative Research\'s summaries, not the Commission\'s reports. The 16th Commission\'s shares sum to 100.02 through rounding.'],['Pool',"A state's share of the pool is only part of its revenue. Grants, the Centre's own spending and borrowing limits are separate."],['13th Commission','Two 2015 news reports give 32% as the level before the 14th Commission raised it to 42%.']],
takeaway:"The Commission decides both how much goes to states and how it is shared. This book looks only at the second."},

5:{kicker:'Chapter 5 · Part 2: The Money Formula',title:"The 16th Commission's Formula, 2026 to 2031",dek:"Population's weight rose, a GDP criterion is new, tax effort was dropped and three other weights fell.",stats:[['42.5%','Weight of income distance, the largest'],['17.5%','Weight of the 2011 population, up from 15%'],['10%','Weight of demographic performance, down from 12.5%']],stand:'This chapter describes the formula and nothing else. Chapter 6 shows what it does to each state\'s share.',sections:[
{k:'The weights',h2:'The area weight fell by five points and a GDP criterion of ten points was added',body:'<p>Against the 15th Commission, the 16th raised population in 2011 by 2.5 points and added a 10% criterion for contribution to GDP. It cut area by 5 points, income distance by 2.5 points and demographic performance by 2.5 points. Tax and fiscal efforts was dropped.</p>'+f('m5_change','<b>Chart 5.1</b> · Change in weight from the 15th to the 16th Commission, percentage points.',FC+'.','comp','Changes in the weights')},
{k:'The definitions',h2:'Demographic performance now counts population growth from 1971 to 2011',body:'<p>The 16th Commission, according to the summaries we read, uses the inverse of population growth between 1971 and 2011: a state with higher growth over those years receives less under this criterion. The criterion is to be phased out gradually. The contribution-to-GDP criterion is defined as the ratio of the square root of a state\'s GSDP to the sum of the square roots of all states\' GSDP.</p>'},
{k:'Beyond taxes',h2:'The Commission also recommended grants of ₹9.47 lakh crore for 2026 to 2031',body:'<p>Grants-in-aid total ₹9,47,409 crore. Local governments get ₹7,91,493 crore and disaster management ₹1,55,916 crore as the Centre\'s share. These are separate from the tax shares, and this book does not include them in per-head terms.</p>'+f('m5_grants','<b>Chart 5.2</b> · Grants-in-aid recommended for 2026 to 2031, ₹ lakh crore.','PRS Legislative Research, Report of the 16th Finance Commission for 2026-31.','comp')}],
contested:[['Definition','The phrase "inverse population growth" is as given in press and research summaries. We have not read the Commission\'s own definition.'],['Per-state criteria','We have not read the values of each criterion for each state. We cannot say how much of any state\'s share comes from each criterion.']],
takeaway:"The formula moved weight towards population and GDP contribution and away from area. How that played out is the subject of the next chapter."},

6:{kicker:'Chapter 6 · Part 2: The Money Formula',title:'Per-Head Shares of Central Taxes, 15th and 16th Commissions',dek:'Per person, the shares range from 63 to 1,149 on an index where 100 is an equal amount for every person in the 28 states.',stats:[['63 to 1,149','Range of per-head index across the 28 states in the 16th Commission formula'],['27 of 28','States whose share of the pool moved by less than half a point'],['0.50','Largest fall in share, Madhya Pradesh; largest rise 0.48, Karnataka']],stand:"A state's share of the pool is one thing. Its share relative to its population is another. This chapter shows both.",sections:[
{k:'Per head',h2:"Per-head shares are lower for several of the most populous states",body:'<p>Dividing each state\'s share of the pool by its share of the 28 states\' population gives a per-head index. In the 16th Commission formula Uttar Pradesh stands at 104, Bihar at 113, Madhya Pradesh at 119, Rajasthan at 102 and Tamil Nadu at 67. Karnataka is at 80, Kerala 84 and Haryana 63. Arunachal Pradesh is at 1,149 and Sikkim 656. The chart shows the 18 states with at least 2% of the population.</p>'+f('m6_index','<b>Chart 6.1</b> · Per-head index of the share of central taxes, 15th and 16th Commissions (average of the 28 states = 100).',FC+'; '+CENSUS+'. Calculated.','derived','Per-head index, larger states')},
{k:'Change',h2:'Shares moved by half a point or less in every state',body:'<p>From the 15th to the 16th Commission the largest rise in a state\'s share of the pool was 0.48 points (Karnataka) and the largest fall 0.50 points (Madhya Pradesh). The bars list all 28 states.</p>'+f('m6_change','<b>Chart 6.2</b> · Change in each state\'s share of the divisible pool, 16th against 15th Commission, percentage points.',FC+'. Calculated.','derived','Change in share of the pool')},
{k:'The caveat',h2:'An index is not a rupee amount',body:'<p>We give no rupee figure for a state\'s transfer because the pool changes each year and the Commission publishes shares. An index of 100 means that a state receives its population share of the pool. It is not a statement about what a state needs, or contributes.</p>'}],
contested:[['Index base','The index uses the 28 states\' combined 2011 population. Including union territories would change every index by a few per cent.'],['Rounding','The Commission publishes shares to two decimals.'],['Causes','We cannot say which criterion produced a given change.']],
takeaway:'Per head, shares differ by a factor of more than eighteen. The 16th Commission moved every one of them by half a point or less.'},

7:{kicker:'Chapter 7 · Part 3: The Seat Question',title:'What the Three Bills Said',dek:'On 16 April 2026 the Government introduced three Bills in the Lok Sabha. The central one, a constitutional amendment, was voted down the next day.',stats:[['3','Bills introduced on 16 April 2026'],['298 to 230','Vote on the 131st Amendment on 17 April; 352 votes were needed'],['850','Proposed maximum Lok Sabha strength: up to 815 for states and 35 for union territories']],stand:'This chapter sets out what the Bills proposed and what happened to them, as reported. We have not read the Bill texts themselves.',sections:[
{k:'The package',h2:'One constitutional amendment and two ordinary Bills were introduced together',body:t(['Bill','What it proposed (as reported)','What happened'],[['Constitution (131st Amendment) Bill, 2026','Raise the maximum strength of the Lok Sabha from 550 to 850. Remove the requirement that delimitation follow the first census after 2026, and let Parliament decide by law when and on which census it is done. Apply the one-third reservation for women straight after the new delimitation.','Defeated on 17 April 2026: 298 for, 230 against. Needed 352.'],['Delimitation Bill, 2026','Use the latest published census when the Commission is constituted, which implies 2011. Allocate seats among states in proportion to population.','Reported as withdrawn. PRS lists it as infructuous.'],['Union Territories Laws (Amendment) Bill, 2026','Extend the corresponding changes to Delhi, Puducherry and Jammu and Kashmir.','Reported as withdrawn.']],null,680)+f('m7_house','<b>Chart 7.1</b> · Lok Sabha strength: the constitutional maximum, the House today and the proposed maximum.',PRS+'.','comp','The House would have grown by more than half')},
{k:'The vote',h2:'The amendment got 298 of the 528 votes cast; it needed two-thirds of those present and voting',body:'<p>A constitutional amendment of this kind needs a majority of the whole House and two-thirds of the members present and voting. Two-thirds of 528 is 352. The Bill received 298 votes in favour and 230 against.</p>'+f('m7_vote','<b>Chart 7.2</b> · Lok Sabha vote on the Constitution (131st Amendment) Bill, 17 April 2026.','Press report of the vote; two-thirds of 528 calculated.','rep','The vote fell 54 short of two-thirds')},
{k:'Projections',h2:'PRS projected where seats would move if the 2011 Census were used for a House of about 543',body:'<p>PRS Legislative Research published a table of projected seats on the 2011 Census. At a House of about 543, Uttar Pradesh 89 (from 80), Bihar 46 (from 40), Rajasthan 30 (from 25), Tamil Nadu 32 (from 39) and Kerala 15 (from 20). Chapter 8 repeats the arithmetic with a stated method.</p>'+f('m7_prs','<b>Chart 7.3</b> · PRS projection of seats on 2011 Census population, selected states.',PRS+'.','comp','PRS projection for five states')},
{k:'Since',h2:'We found no new Bill after April',body:'<p>The latest sources we read, dated July and August 2026, discuss the defeat and its aftermath. The freeze on seats among states stays in force until the figures of the first census after 2026 are published.</p>'},
{k:'The process',h2:'What a constitutional amendment takes',body:t(['Step','What the rule requires'],[['1. Introduction','A Bill to amend the Constitution is introduced in either House.'],['2. Passage in each House','A majority of the total membership and two-thirds of members present and voting.'],['3. Ratification','For amendments that touch the representation of states in Parliament, ratification by at least half of the state legislatures.'],['4. Assent','The President gives assent.']],null,540)+'<p style="margin-top:8px">This process is described from our general understanding of Article 368, not from a reading of the Article in this edition.</p>'}],
contested:[['Opposition votes','Two reports of the vote: one gives 298 for and 230 against; another gives only 298 and 528 voting. We use 298 to 230.'],['Bill texts','We did not read the Bill texts. The descriptions are from PRS and press reports.'],['195 seats','The Home Minister reported on 17 April that southern states would have 195 seats. 195 of 850 is 22.9%, not the 23.87% reported. Chapter 9 shows the figure.']],
takeaway:'Three Bills were introduced and none is alive. The seat allocation by state rests on the 1971 Census until new census figures are published.'},

8:{kicker:'Chapter 8 · Part 3: The Seat Question',title:'A Seat Formula on 2011 Population',dek:'If the 543 seats were divided afresh by 2011 population, '+up+' seats would change state. If the House were 850, every state with ten or more seats would have more than it has now.',stats:[[up+'','Seats that change state in a House of 543, if seats follow 2011 population'],[g('pop','Uttar Pradesh',850)+'','Uttar Pradesh seats in a House of 850 under this rule, against 80 now'],[this.south(R850.pop)+' of 850','Seats for the five southern states in a House of 850, against 129 of 543 now']],stand:'This is the arithmetic of one rule, set out in full in chapter 12. It is the rule the Delimitation Bill described, applied to the 2011 Census.',sections:[
{k:'The rule',h2:'Give every state seats in proportion to its 2011 population, with a floor of one',body:'<p>We used the largest-remainder method. Divide the population by the number of seats to get a quota, give each state the whole number of quotas it holds, then give the remaining seats to the states with the largest fractions. This is our rule. The Delimitation Bill, as reported, said "in proportion to population." PRS Legislative Research published projections that match ours for most states.</p>'},
{k:'House of 543',h2:up+' seats would change state, with no change in the size of the House',body:'<p>Uttar Pradesh would gain '+(g('pop','Uttar Pradesh')-80)+', Bihar '+(g('pop','Bihar')-40)+' and Rajasthan '+(g('pop','Rajasthan')-25)+'. Tamil Nadu would lose '+(39-g('pop','Tamil Nadu'))+', Kerala '+(20-g('pop','Kerala'))+' and Andhra Pradesh '+(25-g('pop','Andhra Pradesh'))+'.</p>'+f('m8_now_pop','<b>Chart 8.1</b> · Seats now and under 2011 population, house of 543, states with 10 or more seats.',CENSUS+'; '+SEATS+'. '+INC,'illus','Seats now and with seats by 2011 population')+f('m8_change','<b>Chart 8.2</b> · Change in seats under 2011 population, house of 543.',CENSUS+'; '+SEATS+'. '+INC,'illus')+f('m8_share','<b>Chart 8.3</b> · Change in share of seats under 2011 population, house of 543, percentage points.',CENSUS+'; '+SEATS+'. '+INC,'illus')},
{k:'House of 850',h2:'In a House of 850, Uttar Pradesh would have '+g('pop','Uttar Pradesh',850)+' seats and Tamil Nadu '+g('pop','Tamil Nadu',850),body:'<p>Every state with ten or more seats would have more than it has now in absolute terms. In share terms the picture matches the House of 543: the same states gain and lose share.</p>'+f('m8_850','<b>Chart 8.4</b> · Seats now and under 2011 population, house of 850.',CENSUS+'; '+SEATS+'. '+INC,'illus','Seats now and in a House of 850')},
{k:'The table',h2:'The full list for the larger states',body:t(['State','Seats now','House of 543','Change','House of 850'],BIGN.map(u=>[u[0],''+u[2],''+g('pop',u[0]),sg0(g('pop',u[0])-u[2]),''+g('pop',u[0],850)]),[1,2,3,4],540)}],
contested:[['PRS projection','PRS projects about 548 seats in its "unchanged" case and gives Rajasthan 30. Our method gives exactly 543 and Rajasthan '+g('pop','Rajasthan')+'.'],['Method','Other apportionment methods (Huntington-Hill, Sainte-Laguë) give small differences for a few states. We use largest-remainder for transparency.'],['Not a forecast','Nobody has said that this is how seats would be divided.']],
takeaway:'On the 2011 Census, a population-proportional rule moves '+up+' of 543 seats between states. A larger House changes the counts but, on this rule, not the shares.'},

9:{kicker:'Chapter 9 · Part 3: The Seat Question',title:'Other Ways to Do It',dek:'Seats could be divided by population, by today\'s shares, by a mixture, or by keeping today\'s seats and adding the rest by population. Each gives different numbers.',stats:[[sum5k('pop',850)+' to '+sum5k('freeze',850),'Seats for the five southern states in a House of 850, across four rules'],[N1(sshare('pop',850))+'% to '+N1(sshare('freeze',850))+'%','Their share of the House across the same four rules'],['195','Number reported in the Home Minister\'s statement of 17 April for those five states']],stand:'Four rules are set out side by side. Only the first, today\'s shares kept, and the last, all by 2011 population, are close to anything proposed.',sections:[
{k:'The four rules',h2:'Each rule answers a different question about what seats should reflect',body:t(['Rule','What it does','Where it comes from'],[['Freeze','Keeps each state\'s present share. In a House of 543 nothing changes; in a larger House every state\'s count rises in proportion.','The present constitutional position, with the House enlarged.'],['No state below today\'s count','Every state keeps its present seats. The additional seats go to states in proportion to 2011 population.','The Foundation\'s reading of the Home Minister\'s reported assurance.'],['Half and half','Each state\'s weight is half its present share of seats and half its share of 2011 population.','The Foundation\'s construction, to show a midpoint. No party has proposed it.'],['All by 2011 population','Seats are divided in proportion to 2011 population, with a floor of one.','The approach the Delimitation Bill described, as reported.']],null,680)},
{k:'The southern five',h2:'The five southern states would have between '+sum5k('pop',850)+' and '+sum5k('freeze',850)+' seats of 850, depending on the rule',body:'<p>Andhra Pradesh, Karnataka, Kerala, Tamil Nadu and Telangana hold '+SOUTH_NOW+' of 543 seats today, or '+N1(SOUTH_NOW/543*100)+'%. In a House of 850, keeping today\'s shares gives them '+sum5k('freeze',850)+'. Letting nobody fall gives '+sum5k('noloss',850)+'. Half and half gives '+sum5k('blend',850)+'. All by population gives '+sum5k('pop',850)+', or '+N1(sshare('pop',850))+'%.</p>'+f('m9_south','<b>Chart 9.1</b> · Seats for the five southern states in a House of 850, under each rule.',CENSUS+'; '+SEATS+'; the reported figure of 195 is from a press account of the Home Minister\'s statement. '+INC,'illus','Five southern states, four rules, one reported figure')+'<p>The reported assurance of 195 seats lies between the no-state-below rule ('+sum5k('noloss',850)+') and the freeze rule ('+sum5k('freeze',850)+').</p>'+f('m9_share','<b>Chart 9.2</b> · Share of Lok Sabha seats for the five southern states, today and under three rules for a House of 850.',CENSUS+'; '+SEATS+'. '+INC,'illus')},
{k:'House of 543',h2:'With the House unchanged, only two of the four rules move seats',body:'<p>At 543, the freeze and the no-state-below rule both leave every state where it is. The half-and-half rule gives the southern five '+sum5k('blend',543)+' seats, and the population rule gives '+sum5k('pop',543)+'.</p>'+f('m9_south543','<b>Chart 9.3</b> · Seats for the five southern states in a House of 543, under three rules.',CENSUS+'; '+SEATS+'. '+INC,'illus')},
{k:'Selected states',h2:'Five states, four rules, House of 850',body:t(['State','Seats now','Freeze','No state below today','Half and half','All by population'],['Uttar Pradesh','Maharashtra','Bihar','West Bengal','Tamil Nadu','Rajasthan','Karnataka','Kerala'].map(n=>([n,''+nw(n),''+g('freeze',n,850),''+g('noloss',n,850),''+g('blend',n,850),''+g('pop',n,850)])),[1,2,3,4,5],600)}],
contested:[['Names','The rule called "no state below today\'s count" is our name for one reading of a reported assurance. Others have read the assurance as keeping today\'s share, which is the freeze rule.'],['The 195','The reported figure of 195 and its share (23.87%) do not reconcile. 195 of 850 is 22.9%.'],['Grouping','Treating five states as one group hides differences among them.']],
takeaway:'The four rules give the southern five between '+sum5k('pop',850)+' and '+sum5k('freeze',850)+' of 850 seats. The reported figure of 195 sits near the top of that range.'},

10:{kicker:'Chapter 10 · Part 4: Both Together',title:'Money and Seats Side by Side',dek:'The two sets of changes do not line up in any simple way.',stats:[['','Correlation between change in seat share (population rule, 543) and change in tax share is weak'],[(sf16-sf15>=0?'+':'')+N1(sf16-sf15)+'pts','Change in the five southern states\' share of central taxes, 15th to 16th Commission'],[N1(SOUTH_NOW/543*100)+'% to '+N1(this.south(R543.pop)/543*100)+'%','Their share of seats now and under the population rule, house of 543']],stand:'For the first time in this book the two sets of numbers share a chart. The chart shows co-movement. It does not show that either decision was made with the other in mind.',sections:[
{k:'Two changes',h2:"Each state has a change in money share and a possible change in seat share",body:'<p>The money change is real: the 16th Commission\'s share minus the 15th\'s, in percentage points of the divisible pool. The seat change is hypothetical: if seats followed 2011 population in a House of 543. They are in the same units — percentage points of a national total — but they are not the same kind of fact.</p>'+f('m10_scatter','<b>Chart 10.1</b> · Each state\'s change in seat share (population rule, house of 543) against its change in share of central taxes (16th against 15th Commission). Southern states in orange.',FC+'; '+CENSUS+'; '+SEATS+'. '+INC,'illus','Seat share change and money share change, 28 states')},
{k:'Per head',h2:'Money per head and seats per head today point different ways for several large states',body:'<p>A second chart puts a state\'s tax share per head against its seats per head, both indexed. Kerala and Tamil Nadu have high seats per head and low money per head; Madhya Pradesh and Bihar the reverse.</p>'+f('m10_scatter2','<b>Chart 10.2</b> · Share of central taxes per head (16th Commission, average = 100) against seats per head today (national average = 100), states with at least 2% of the population.',FC+'; '+CENSUS+'; '+SEATS+'. Calculated.','derived','Money per head and seats per head today')},
{k:'Reading it',h2:'What the numbers can and cannot say',body:'<p>The chart can say that the same states are not at the top on both. It cannot say that one thing causes another, that one offsets the other, or that a state should receive more of either.</p>'}],
contested:[['Two kinds of change','One change is a decision already taken. The other is the output of a rule nobody has adopted.'],['Correlation','A correlation across 28 states is weak to moderate and depends on a few states.'],['Money measures',"The tax share excludes grants and centrally sponsored schemes."]],
takeaway:'Seat changes and tax-share changes do not mirror each other across the 28 states.'},

11:{kicker:'Chapter 11 · Part 4: Both Together',title:'Other Federations',dek:'Federations that use population-based lower houses commonly balance them with a second chamber, minimum representation or fixed seat counts.',stats:[['761,169','Average people per member of the US House, 2020 apportionment'],['2','US Senators per state, whatever its population'],['343','House of Commons seats in Canada after the 2021 readjustment']],stand:'Each country below made its own choice for its own history. We describe the rules, show the representation ratios they produce, and compare nothing beyond that.',sections:[
{k:'United States',h2:'The House is fixed at 435 seats; the Senate gives every state two',body:'<p>The House has had 435 voting seats since 1929. Seats are divided among the states after each census by the method of equal proportions, and every state has at least one. The national average after the 2020 census is 761,169 people per member. The Senate has two members per state.</p>'+f('m11_people','<b>Chart 11.1</b> · People per member of the lower house, India (1971 and 2011) and the United States (2020 average), million.','US figure from Wikipedia (2020 census, 761,169); India from chapter 1. Calculated.','rep','People per lower-house member')},
{k:'Canada',h2:'The House of Commons uses a formula and two protections for smaller provinces',body:'<p>Canada\'s House of Commons has 343 seats after the 2021 readjustment. A formula divides seats by population, and two protections apply: a senatorial clause says no province can have fewer seats than it has senators; a grandfather clause protects other provinces.</p>'+f('m11_canada','<b>Chart 11.2</b> · House of Commons seats by province, 2021 readjustment. Orange: provinces protected by the senatorial clause.','Elections Canada material on the 2022 redistribution.','rep','Seats by province, Canada')},
{k:'Germany',h2:'In the Bundesrat, Bremen has three votes and North Rhine-Westphalia six',body:'<p>The Bundesrat represents the Länder. Bremen, with 663,000 inhabitants, has 3 votes. North Rhine-Westphalia, with 18,058,000, has 6. The arrangement is a choice to give the smaller Länder more weight per head in the chamber that represents them.</p>'+f('m11_bundesrat','<b>Chart 11.3</b> · People per Bundesrat vote, Bremen and North Rhine-Westphalia.','Wikipedia, as reported there. Calculated.','rep','Bundesrat votes per head')},
{k:'What it shows',h2:'Population, floors and a second chamber appear in every case',body:t(['Federation','Lower-house size','Floor for small units','Second chamber'],[['India','543, fixed since the 1970s','1 seat per state or territory','Rajya Sabha (not covered here)'],['United States','435, fixed since 1929','1 seat per state','2 per state'],['Canada','343 after 2021','Senatorial and grandfather clauses','Senate (not covered here)'],['Germany','630 since 2025','Not covered by our source','Bundesrat: e.g. 3 votes for Bremen, 6 for NRW']],null,680)+'<p style="margin-top:8px">We list the second chambers because each comparison depends on them. We have not covered their rules.</p>'}],
contested:[['Comparability','These federations differ in history and in the powers of their chambers. India\'s largest state has about 16.5% of its population.'],['Sources','The figures come from encyclopedic summaries of constitutions and statutes.']],
takeaway:'Every federation here departs from pure population in at least one chamber. They differ in which chamber, and by how much.'},

12:{kicker:'Chapter 12 · Part 5: The Calculator',title:'How the Calculator Works',dek:'Set a House size and a rule. The calculator gives every state\'s seats, the change from today, and the change in seat share, next to the change in the state\'s share of central taxes.',stats:[['543 to 850','House sizes the calculator accepts'],['4','Seat rules: freeze, all by 2011 population, no state below today\'s count, half and half'],['36','States and union territories, with their 2011 populations and seats now']],stand:'The calculator is below. Every input and rule is stated. The defaults are the status quo and the Bill\'s approach.',calc:true,sections:[
{k:'The rules',h2:'Four rules, each stated exactly',body:t(['Rule','Exact definition'],[['Freeze','At 543, each state keeps its seats. At a larger House, the weights are today\'s seats and the House is divided by largest remainder with a floor of one.'],['All by 2011 population','The weights are 2011 populations. The House is divided by largest remainder with a floor of one.'],["No state below today's count","Every unit keeps its present seats. The additional seats (house size minus 543) are divided by largest remainder on 2011 population, with no floor."],['Half and half',"Each unit's weight is half its share of today's 543 seats plus half its share of the 2011 population. Divided by largest remainder with a floor of one."]],null,600)+'<p style="margin-top:8px">Largest remainder: divide total weight by the house size to get a quota, give each unit the whole number of quotas it has (at least one), and give any remaining seats to units with the largest remainders.</p>'},
{k:'The data',h2:'Every input is a 2011 or current figure with a named source',body:t(['Input','Source','Tag'],[['Population of 36 states and union territories, 2011',CENSUS,'Compiled'],['Lok Sabha seats now',SEATS,'Compiled'],['Share of central taxes, 15th and 16th Commissions, 28 states',FC,'Compiled']],null,600)+'<p style="margin-top:8px">The state populations sum to 1,210,568,112. The national figure is 1,210,854,977, a difference of 286,865. We use the list sum for shares.</p>'},
{k:'Checks',h2:'The page was tested against an independent Python computation',body:'<p>The seat results were computed once in Python and the page recomputes them in the browser. Before publication we ran the browser calculation for every combination of the four rules and 308 house sizes from 543 to 850, and compared the results with the Python computation. They matched in every case.</p>'}],
contested:[['Method','Other methods give different answers for a handful of seats. We chose largest remainder for transparency.'],['Floor','A floor of one seat is our assumption. The Constitution has its own provision for small units, which we have not read.'],['Not a forecast','Every output is the result of a rule applied to the 2011 Census.']],
takeaway:'The calculator is a way to check the arithmetic, not an argument. Every seat figure in chapters 8 and 9 can be reproduced with it.'},

13:{kicker:'Chapter 13 · Part 5: The Positions',title:'What Reasonable People Disagree About',dek:'The numbers do not choose among the positions below. Each is stated as its holders might state it. None has yet been reviewed by people who hold it.',stats:[['5','Positions set out, with the case for each'],['0','Positions the Foundation recommends'],['2','Reviews still to come: a constitutional lawyer, and holders of each position']],stand:'Where a position can be tied to a statement we read, we name the statement. These summaries are for the people who hold the views to correct.',sections:[
{k:'Position 1',h2:'Seats should follow current population: one person, one vote, one value',body:'<p>The case is that the aim of delimitation is equal weight for each person\'s vote. On this view, a seat standing for 27 lakh people in Rajasthan and 17 lakh in Kerala gives some voters more than one and a half times the weight of others, and the freeze has lasted fifty years while the population more than doubled. The Delimitation Bill, as reported, would have divided seats in proportion to population.</p><p><em>What it would need to be true:</em> that equal weight for individuals is the main purpose of a lower house, and that other values are served elsewhere, for example by the Rajya Sabha. The numbers: under this rule, '+up+' of 543 seats change state (chapter 8).</p>'},
{k:'Position 2',h2:'The freeze should be kept or extended, because slowing population growth was what the country asked states to do',body:'<p>The case is that states that succeeded in slowing population growth would lose representation to states that did not. Those who hold this view ask for the 2026 exercise to be suspended and the freeze extended, one report saying for thirty years.</p><p><em>What it would need to be true:</em> that a state\'s past population policy should count in its present share of seats, and that the gap in people per seat is an acceptable price. The numbers: under this rule, the House stays at 543 with no change.</p>'},
{k:'Position 3',h2:'A larger House could protect every state\'s present seats while adding seats for faster-growing ones',body:'<p>The case, as stated by the Union Home Minister on 17 April, is that no southern state would lose seats and that they would gain on a pro-rata basis. One commentary suggests a reconciliation: extend the freeze on seats among states while updating boundaries within states to the 2011 Census.</p><p><em>What it would need to be true:</em> that a House of 850 is workable and acceptable, and that no state should lose seats in absolute terms. Under our reading of this position, the southern five would have '+this.south(R850.noloss)+' of 850 seats ('+N1(this.south(R850.noloss)/850*100)+'%), against 23.8% today.</p>'},
{k:'Position 4',h2:'Delimitation should wait, and should not be tied to other changes',body:'<p>The case is that it is premature to act while the 2026-27 Census is under way, and that linking delimitation to the one-third reservation for women makes the reservation hostage to a contested change. The press report notes broad support for the reservation itself.</p><p><em>What it would need to be true:</em> that the 2027 Census results will change what the decision should be. The 2027 Census figures are expected to be published by late 2027. When they are, the freeze lapses unless Parliament acts.</p>'},
{k:'Position 5',h2:'Money and seats are separate questions and should be decided separately',body:'<p>We found no statement that sets out this view. It is a position that arises from chapter 10: the Finance Commission distributes tax revenue by criteria that include income distance, area and population, and seats distribute political weight. On this view, a change in one should not be offset by the other. We include this position because the book places the two together, and a reader should know that doing so is itself a choice.</p>'},
{k:'Map',h2:'Where the numbers help and where they do not',body:t(['Question','Do the numbers help?'],[['How many people does a seat stand for in each state?','Yes. Chapter 3 gives the 2011 figures.'],['What would each rule do to each state\'s seats?','Yes. Chapters 8, 9 and 12.'],['What did the 16th Commission do to each state\'s share?','Yes. Chapters 5 and 6.'],['Should equal weight for each person outweigh other values?','No. This is a question of values.'],["Should a state's population policy count in its share?",'No. This is a question of values.'],['Is a House of 850 workable?','Partly. Chapter 11 gives the sizes of other houses.'],['Should seats and money be weighed together?','No. The book shows them together; it does not say whether to weigh them.']],null,600)}],
contested:[['Review','These summaries have not been read by people who hold the positions.'],['Attribution','We attribute a position to a person or body only where we read a statement.'],['Missing positions','We did not find statements from northern or eastern states, smaller states, or union territories.']],
takeaway:'The book can say how many seats and how much money move under each choice. It cannot say which of the values behind the positions should weigh most.'}
    };
    return d[n]||null;
  }

  buildEpilogue(){
    const N1=v=>v.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
    const up=this.R543.pop.reduce((a,v,i)=>v>this.U[i][2]?a+1:a,0);
    return '<article>'+this.chead('Epilogue','Questions the Numbers Cannot Answer','The arithmetic is done. What remains are questions about what a lower house is for.',this.stat(up+'','Seats that change state if 543 follow 2011 population')+this.stat('2027','Census whose results will reopen the question')+this.stat('0','Positions the Foundation recommends'),'The Foundation takes no position on how seats or money should be divided.')+
    this.sec('Open','Seven questions the numbers do not settle',this.tbl(['Question','Why numbers do not settle it'],[['Should every vote carry the same weight?','Equal weight for each person and balance among states are both claims about what the lower house is for.'],['Should past population policy count?','Whether to reward or ignore a state\'s record is a judgement about fairness.'],["Should one state's loss be made up in another currency?",'Seats and money are different goods.'],['How large should the House be?','Cost, workability and constituency size trade against each other.'],['Should the second chamber do the balancing?','Other federations do. Whether India\'s does, or should, is outside this book.'],['Who should decide?','The process, the majority required and who is consulted matter as much as the result.'],['What if the 2027 Census changes the numbers?','The figures here are 2011. A new census would move them.']],null,640)+this.fig('m9_share','One summary: the same states, three rules for a house of 850.','Census of India 2011; seats by state. Our calculation.','illus'))+
    this.sec('Next','What would change this book','<p>The release of 2027 Census figures; a new Bill; the Commission\'s own tables; review by a constitutional lawyer and by people who hold each view; and the originals of the sources we read second-hand.</p>')+
    this.take('Numbers can show what each rule would do. They cannot say which rule the country should choose.')+
    this.pager({k:'ch-13',dir:'Chapter 13',title:'What Reasonable People Disagree About',ts:'Five positions.'},{k:'appendix',dir:'Appendix',title:'Method, Sources and What Comes Next',ts:'Evidence tags, source conflicts, what we could not find.'})+'</article>';
  }

  buildAppendix(){
    return '<article><header class="chead"><div class="kicker">Appendix</div><h1>Method, Sources and What Comes Next</h1><p class="dek">How the figures were gathered, what each evidence tag means, where sources disagree and what we could not find.</p></header>'+
    this.sec('A','Evidence tags','<p>'+this.tier('primary')+' The figure was read from the original document. <em>None in this edition.</em></p><p style="margin-top:8px">'+this.tier('comp')+' A named third party\'s tabulation of an official document, which we read directly. PRS Legislative Research pages.</p><p style="margin-top:8px">'+this.tier('rep')+' A press or reference-site report of a figure whose original we did not read.</p><p style="margin-top:8px">'+this.tier('derived')+' Our arithmetic on figures shown.</p><p style="margin-top:8px">'+this.tier('illus')+' A rule applied to the data to show what it would do; not a forecast and not a proposal.</p>')+
    this.sec('B','Review status','<div class="review-note">⚠ This edition has not been reviewed by a constitutional lawyer, or by people who hold each of the positions in chapter 13. Three things in particular need that review: the description of the amendment process in chapter 7, the statements of the positions in chapter 13, and the treatment of the floor of one seat in chapters 8, 9 and 12.</div>')+
    this.sec('C','Where sources disagree',this.tbl(['Item','What the sources say','What we did'],[['Lok Sabha seats after the 1962 exercise','522 in one source; 520 in others','Used 522'],['Home Minister\'s figures','195 of 850 seats reported as 23.87%. 195 of 850 is 22.9%.','Showed 195 and flagged the inconsistency'],['PRS projection against ours','PRS: about 548 seats at "unchanged", Rajasthan 30. Ours: 543 and 31.','Kept both and said so'],['Population totals','State list sums to 1,210,568,112; national total 1,210,854,977','Used the list sum for shares'],['Fate of the Delimitation Bill','"Infructuous" in one source; "withdrawn" in another','Said withdrawn and recorded the difference'],['Vote on 17 April','298 for in two reports; 230 against in one','Used 298 to 230']],null,720))+
    this.sec('D','What we could not find','<p>The Census 2011 tables as published; the 16th Commission\'s own report and its per-state criterion values; the texts of the three Bills; Parliament\'s debates of 1976 and 2001; the 1971 Census populations by state; the European Parliament\'s allocation among member states; any statement on money and seats considered together.</p>')+
    this.sec('E','What comes next','<p>First, review by a constitutional lawyer and by holders of each position. Second, the primary sources listed in D. Third, a version of the calculator with a second census year. Fourth, publication of the 2027 Census results.</p>')+
    '<section class="sec"><div class="kicker">F · Sources</div><h2>Sources</h2><ul class="sources"><li>Wikipedia: list of states and union territories of India by population; list of constituencies of the Lok Sabha</li><li>PRS Legislative Research: Report of the 15th and 16th Finance Commissions; Constitution (131st Amendment) Bill, 2026; Delimitation Bill, 2026</li><li>Wikipedia: Delimitation Commission of India; Bundesrat; House of Representatives</li><li>Press accounts of the vote and the Home Minister\'s statement (17 April 2026); LiveLaw; Deccan Herald; Vajiram and Ravi; Drishti IAS</li><li>Elections Canada material on the 2022 redistribution</li></ul></section>'+
    this.pager({k:'epilogue',dir:'Epilogue',title:'Questions the Numbers Cannot Answer',ts:'Seven questions.'},null)+'</article>';
  }

  /* ── ROUTER ── */
  buildPage(key){const m={home:()=>this.buildHome(),contents:()=>this.buildContents(),charts:()=>this.buildCharts(),prologue:()=>this.buildPrologue(),epilogue:()=>this.buildEpilogue(),appendix:()=>this.buildAppendix()};if(m[key])return m[key]();const n=parseInt(key.replace('ch-',''));if(n>=1&&n<=13)return this.buildChapter(n);return this.buildHome();}

  PAGES={'home':'Home','contents':'Contents','charts':'Charts','calculator':'Calculator','prologue':'Prologue: Two Formulas, One Federation','epilogue':'Epilogue: Questions the Numbers Cannot Answer','appendix':'Appendix','ch-1':'Chapter 1','ch-2':'Chapter 2','ch-3':'Chapter 3','ch-4':'Chapter 4','ch-5':'Chapter 5','ch-6':'Chapter 6','ch-7':'Chapter 7','ch-8':'Chapter 8','ch-9':'Chapter 9','ch-10':'Chapter 10','ch-11':'Chapter 11','ch-12':'Chapter 12','ch-13':'Chapter 13'};

  componentDidMount(){
    this._tip=document.getElementById('tip');
    const tog=document.getElementById('ttog');
    if(tog){const isDark=()=>document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&window.matchMedia('(prefers-color-scheme:dark)').matches);tog.textContent=isDark()?'☀':'☽';tog.addEventListener('click',()=>{const d=isDark();document.documentElement.setAttribute('data-theme',d?'light':'dark');tog.textContent=d?'☽':'☀';});}
    this._scroll=()=>{const d=document.documentElement,h=d.scrollHeight-d.clientHeight,p=document.getElementById('prog');if(p&&h>0)p.style.width=(d.scrollTop/h*100)+'%';};
    window.addEventListener('scroll',this._scroll,{passive:true});
    this._route=()=>this.renderPage();
    window.addEventListener('hashchange',this._route);
    this.renderPage();
  }
  componentWillUnmount(){window.removeEventListener('hashchange',this._route);window.removeEventListener('scroll',this._scroll);this._ro.forEach(o=>o.disconnect());this._ro=[];}

  renderPage(){
    this._ro.forEach(o=>o.disconnect());this._ro=[];this.hideTip();
    const key=(location.hash.replace(/^#\/?/,'')||'home');
    const k=this.PAGES[key]?key:'home';
    const main=document.getElementById('main');if(!main)return;
    main.innerHTML=this.buildPage(k);
    main.querySelectorAll('[data-chart]').forEach(h=>{const f=this.R[h.dataset.chart];if(f)f(h);});
    const calcMount=document.getElementById('calc-mount');if(calcMount)this.buildCalc(calcMount);
    document.title=(this.PAGES[k]||'Home')+' · Money and Seats';
    document.querySelectorAll('.sitebar a[data-k]').forEach(a=>{if(a.dataset.k===k)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
    const prog=document.getElementById('prog');if(prog)prog.style.width='0%';
    window.scrollTo(0,0);main.focus({preventScroll:true});
  }

  renderVals(){return{};}
}
