  buildPrologue(){
    return '<article>'+this.chead('Prologue','The Ledger','What Indian families owe, what they own, and what nobody has yet counted.',
      this.stat('45.9%','Household debt, % of GDP, March 2026 (RBI)')+this.stat('47.8%','On the BIS measure, December 2025: the highest since its series began in 2007')+this.stat('78% v 41%','Growth in household debt against growth in GDP, June 2022 to March 2026')+this.stat('5th of 7','India\'s rank for household debt among its seven-country peer panel'),
      'Indian families borrowed faster than the economy grew. The country has the totals. It does not yet have the split that says who carries the debt.')+
    this.sec('The debt','Household debt rose from 36.4% to 45.9% of GDP in under four years','<p>The Reserve Bank of India publishes a quarterly balance sheet for households. In June 2022 families owed ₹89.1 lakh crore, 36.4% of GDP. By March 2026 they owed ₹158.5 lakh crore, 45.9%.</p><p>The ratio rose in 14 of the 15 quarters in between. Debt grew 77.9%. The economy it rests on grew 41.1%.</p>'+this.fig('debt_gdp','<b>Chart P.1</b> · Household financial liabilities, % of GDP, quarterly, June 2022 to March 2026.','RBI Bulletin, September 2026, Current Statistics Table 52(b).','primary'))+
    this.sec('The cushion','Families own three times what they owe, and the cushion is thinner','<p>Households hold ₹490.2 lakh crore of financial assets, about three times their debt. Net of debt that is 96.0% of GDP.</p><p>For every ₹100 of financial assets, families now owe ₹32.3. In June 2022 they owed ₹27.1. Net financial assets were 110.0% of GDP in September 2024.</p>'+this.fig('per100','<b>Chart P.2</b> · Household debt per ₹100 of financial assets, quarterly, June 2022 to March 2026.','RBI Bulletin, September 2026, Table 52(b). Ratio calculated from the table.','derived'))+
    this.sec('The comparison','Fifth of seven: below China and the United States, rising faster than all of them','<p>On the BIS measure India\'s households owe 47.8% of GDP. Korea and Thailand owe nearly twice that. Brazil and Indonesia owe less.</p><p>In the year to December 2025 India\'s ratio rose 3.3 points. Five of the six peers\' ratios fell. <a href="#/ch-2">Chapter 2</a> sets out the comparison.</p>'+this.fig('peers','<b>Chart P.3</b> · Total credit to households, % of GDP, fourth quarter of 2025. India in orange.','BIS total credit to households and NPISHs, adjusted for breaks, via FRED (series updated 15 June 2026).','primary'))+
    this.sec('The mix','What the money was for is the next question','<p>The RBI\'s totals do not say what families borrowed for. A home loan is backed by a house and a gold loan by gold. A personal loan or a card balance is backed by nothing. Part II looks at how the mix has changed, as the figures are confirmed against the RBI\'s own reports.</p>')+
    this.sec('The gap','Nobody can yet say which households carry it','<p>The RBI counts loans by lender and instrument. It does not report them by income, age, occupation or place. The last official survey of household debt refers to 30 June 2018. It found 35% of rural and 22.4% of urban households in debt.</p><p>Part III builds the best proxies available and says what each cannot show. The case for a better official table closes the book.</p>')+
    this.take('Household debt is rising on two independent measures. The totals are known. The split is not, and without the split nobody can say whether the rise is a problem.')+
    '<section class="sec"><p class="note" style="font-style:italic">How to read this book. Every chart has a source line and an evidence tag: '+this.tier('primary')+' (read from the original release) or '+this.tier('derived')+' (our arithmetic on primary data). '+this.tier('comp')+' marks survey data tabulated by a named third party; '+this.tier('illus')+' marks invented examples. Tap or hover a chart to read values. Every chart has its data as a table.</p></section>'+
    this.pager(null,{k:'ch-1',dir:'Chapter 1',title:'Borrowing Outran the Economy',ts:'Household debt grew 78% in under four years.'})+'</article>';
  }

  chapterNav(n){const t={1:{dir:'Chapter 1',title:'Borrowing Outran the Economy',ts:'Household debt grew 78% in under four years.'},2:{dir:'Chapter 2',title:'Fifth of Seven',ts:'India\'s ratio is rising while peers\' fall.'},3:{dir:'Chapter 3',title:'A Thinner Cushion',ts:'For every ₹100 of financial assets, families now owe ₹32.'},4:{dir:'Chapter 4',title:'Beyond the Home Loan',ts:'Most household borrowing is no longer for a house.'},5:{dir:'Chapter 5',title:'Gold as Collateral',ts:'Gold loans are the largest non-housing retail product, and the fastest growing.'},6:{dir:'Chapter 6',title:'Small Loans',ts:'The smallest personal loans are increasingly made by fintech lenders.'},7:{dir:'Chapter 7',title:'Cards, Pay Later and the Apps',ts:'Card balances fell in 2025-26.'},8:{dir:'Chapter 8',title:'The Missing Split',ts:'The best answer to who carries the debt is eight years old.'},9:{dir:'Chapter 9',title:'What the EMI Takes',ts:'Debt matters through what it costs each month.'},10:{dir:'Chapter 10',title:'Where the Debt Lives',ts:'Household debt differs sharply across states.'},11:{dir:'Chapter 11',title:'Assets Behind the Debt',ts:'Most of what families own is land, buildings and gold.'},12:{dir:'Chapter 12',title:'Three Shocks',ts:'A stress test asks what a plausible shock would do.'},13:{dir:'Chapter 13',title:'When the Pay Stops',ts:'Young borrowers hold a large share of the newest small loans.'},14:{dir:'Chapter 14',title:'Ten Numbers to Watch',ts:'A quarterly tracker of ten indicators.'},15:{dir:'Chapter 15',title:'The Table That Does Not Exist',ts:'The RBI could publish debt by income band, age and occupation.'}};return t[n]||{dir:'Chapter '+n,title:'',ts:''};}

  buildChapter(n){
    const d=this.chapterData(n);if(!d)return '<article><p>Chapter '+n+' not yet available.</p></article>';
    const prev=n===1?{k:'prologue',dir:'Prologue',title:'The Ledger',ts:'What Indian families owe, what they own.'}:{k:'ch-'+(n-1),...this.chapterNav(n-1)};
    const next=n===15?{k:'epilogue',dir:'Epilogue',title:'The 2030 Household Report Card',ts:'Seven measures and the direction that counts as progress.'}:{k:'ch-'+(n+1),...this.chapterNav(n+1)};
    let html='<article>'+this.chead(d.kicker,d.title,d.dek,d.stats.map(s=>this.stat(s[0],s[1])).join(''),d.stand);
    d.sections.forEach(s=>{html+=this.sec(s.k,s.h2,s.body);});
    if(d.contested)html+=this.contested(d.contested);
    if(d.takeaway)html+=this.take(d.takeaway);
    return html+this.pager(prev,next)+'</article>';
  }

  chapterData(n){
    const f=this.fig.bind(this),s=this.sec.bind(this),t=this.tbl.bind(this);
    const FSR='RBI Financial Stability Report, June 2026';
    const NSS='MoSPI, NSS 77th round, All India Debt and Investment Survey press note (debt as on 30 June 2018; fieldwork 2019)';
    const RBI52B='RBI Bulletin, September 2026, Current Statistics Table 52(b)';
    const BIS='BIS total credit to households and NPISHs, adjusted for breaks, via FRED (series updated 15 June 2026)';
    const chapters={
1:{kicker:'Chapter 1 · Part 1: Borrowed Fast',title:'Borrowing Outran the Economy',dek:'Household debt grew 78% in under four years. The economy it sits on grew 41%.',stats:[['45.9%','Household financial liabilities, % of GDP, March 2026 (RBI)'],['36.4%','The same measure in June 2022'],['47.8%','BIS measure, December 2025: the highest since the series began in 2007']],stand:'Indian families owe ₹158.5 lakh crore. Three years and nine months earlier they owed ₹89.1 lakh crore. The ratio to GDP rose in 14 of 15 quarters, and the economy never caught up.',sections:[
{k:'The headline',h2:'Household debt rose from 36.4% to 45.9% of GDP in fifteen quarters',body:'<p>The RBI\'s household balance sheet is built from lenders\' books. It counts loans from banks (₹128.8 lakh crore in March 2026) and from other financial institutions (₹29.8 lakh crore). It does not count borrowing from moneylenders or relatives.</p><p>On that measure households owed 36.4% of GDP in June 2022 and 45.9% in March 2026. The ratio rose in every quarter but one. The pause was the quarter to June 2024, when it held at 41.7%.</p>'+f('debt_gdp','<b>Chart 1.1</b> · Household financial liabilities, % of GDP, quarterly, June 2022 to March 2026.',RBI52B+'.','primary')},
{k:'The comparison',h2:'Debt grew almost twice as fast as the economy',body:'<p>Between June 2022 and March 2026 household liabilities grew 77.9%. Nominal GDP, implied by the RBI\'s own ratios, grew 41.1%. Household financial assets grew 49.0%.</p><p>Debt grew about 1.9 times as fast as GDP. The stock of debt rose 18.7% in the year to March 2024, 13.0% to March 2025 and 15.7% to March 2026.</p>'+f('indexed','<b>Chart 1.2</b> · Household financial liabilities, financial assets and nominal GDP, index, June 2022 = 100.',RBI52B+'. GDP is implied by dividing the RBI\'s liabilities by its liabilities-to-GDP ratio.','derived')},
{k:'Two yardsticks',h2:'The RBI and the BIS disagree on the level and agree on the direction',body:'<p>The BIS publishes its own household credit series so that countries can be compared. For December 2025 it gives 47.8% of GDP. The RBI\'s ratio for the same quarter is 44.9%. The two differ by 2.9 points. They should not be mixed; each chart in this book names the one it uses. Both rise over the period: the BIS series goes from 40.9% in the second quarter of 2022 to 47.8% in the fourth quarter of 2025.</p>'+f('rbi_bis','<b>Chart 1.3</b> · Household debt, % of GDP, RBI measure (quarterly to March 2026) and BIS measure (quarterly to December 2025).',RBI52B+'; '+BIS+'.','primary')},
{k:'The long run',h2:'On the BIS series, India\'s household credit is the highest since the series began',body:'<p>The BIS series starts in the second quarter of 2007. Its earlier high was 46.2% in the third quarter of 2007. It fell to 33.1% in 2016 and rose to 44.3% in late 2020, after GDP fell in the pandemic.</p><p>At 47.8% in the fourth quarter of 2025, the ratio is above both earlier highs. It rose 2.3 points in that quarter alone, the second-largest one-quarter rise in the series.</p>'+f('bis_long','<b>Chart 1.4</b> · BIS total credit to households, % of GDP, quarterly, second quarter of 2007 to fourth quarter of 2025.',BIS+'.','primary')},
{k:'Who lent it',h2:'Banks hold 81% of household debt. Other lenders hold the rest',body:'<p>At March 2026 banks held 81.2% of household liabilities and other financial institutions held 18.8%.</p>'+f('lender','<b>Chart 1.5</b> · Household financial liabilities by lender group, March 2026, % of total.',RBI52B+'. Shares calculated from the table.','derived')}],
contested:[['45.9%','The latest Bulletin (September 2026) gives 45.9% for March 2026. The August edition gave 45.8%. The book uses the latest Bulletin and names the vintage.'],['47.8%','It rose 2.3 points in one quarter after holding at 45.5% for two. We have not found why, and a revision or a GDP change could explain part of it.'],['78%','It depends on the start date. From March 2023 the same calculation gives 55.1% for debt and 31.8% for GDP. Debt still grew faster, but by less.']],
takeaway:'India\'s households are borrowing faster than the economy grows, on two independent measures. The level depends on the yardstick, so the yardstick should always be named.'},

2:{kicker:'Chapter 2 · Part 1: Borrowed Fast',title:'Fifth of Seven',dek:'India\'s households owe less, as a share of GDP, than four of their six peers. They are borrowing faster than any of them.',stats:[['5th of 7','India\'s rank on household credit to GDP, fourth quarter of 2025 (BIS)'],['+3.3 pts','India\'s rise in the year to December 2025: the largest of the seven'],['5 of 6','Peers whose ratio fell over the same year']],stand:'Korea and Thailand owe nearly twice what India\'s households do, as a share of GDP. India is not an outlier on the level. It is on the direction.',sections:[
{k:'The level',h2:'India\'s households owe less than those in Korea, Thailand, the United States and China',body:'<p>The BIS puts Korea at 88.6% of GDP, Thailand at 87.5%, the United States at 68.1% and China at 58.0%. India, at 47.8%, is fifth. Brazil is at 37.6% and Indonesia at 15.5%. The peer list is the Foundation\'s working choice; a different list could change the rank.</p>'+f('peers','<b>Chart 2.1</b> · Total credit to households, % of GDP, fourth quarter of 2025. India in orange.',BIS+'.','primary')},
{k:'The direction',h2:'In the year to December 2025 India\'s ratio rose 3.3 points. Five of six peers\' ratios fell',body:'<p>India\'s ratio went from 44.5% to 47.8%. Brazil\'s rose 1.4 points. The others fell: Indonesia by 0.7, Korea by 1.0, the United States by 1.2, Thailand by 1.3 and China by 2.0.</p><p>A ratio falls when credit grows more slowly than GDP. India\'s nominal GDP also grew. A rising ratio means household credit outpaced it.</p>'+f('peer_change','<b>Chart 2.2</b> · Change in household credit to GDP, percentage points, fourth quarter of 2024 to fourth quarter of 2025.',BIS+'. Change calculated from the two quarters.','derived')},
{k:'What the level hides',h2:'A lower ratio is not a safer one',body:'<p>The ratio sets debt against the size of the economy, not against what a household earns. The Foundation\'s first book puts India\'s income per person at $2,695 in 2024, below the world median and behind Indonesia. The same debt weighs more on a smaller income. The ratio also says nothing about how the debt is repaid.</p>'}],
contested:[['+3.3 pts','Of this, 2.3 points came in the fourth quarter alone. We have not found why. A single quarter should not be read as a trend.'],['5th of 7','The rank depends on the seven chosen. The panel is the Foundation\'s own choice, not a statistical group.'],['47.8%','The BIS adjusts its series for breaks and builds the ratio on a different basis. The RBI\'s ratio for the same quarter is 44.9%, 2.9 points lower.']],
takeaway:'India is not unusual in how much its households owe. It is unusual in how fast the ratio is moving while peers\' ratios fall, and that deserves watching before it reaches theirs.'},

3:{kicker:'Chapter 3 · Part 1: Borrowed Fast',title:'A Thinner Cushion',dek:'Families still own three times what they owe. For every ₹100 of financial assets they now owe ₹32.',stats:[['₹32.3','Debt per ₹100 of financial assets, March 2026. It was ₹27.1 in June 2022'],['96.0%','Net financial assets, % of GDP, March 2026. They were 110.0% in September 2024'],['₹21.5 lakh crore','New borrowing in 2025-26, close to net savings of ₹21.7 lakh crore']],stand:'Indian households hold ₹490 lakh crore of financial assets against ₹158.5 lakh crore of debt. The cushion is large. It is thinner than it was, and the last year added debt faster than it added savings.',sections:[
{k:'The ratio',h2:'Debt per ₹100 of financial assets rose from ₹27.1 to ₹32.3, the highest in the series',body:'<p>The ratio fell to ₹27.7 in September 2024, then rose. It reached ₹30.4 in December 2025 and ₹32.3 in March 2026. Most of that last step came from assets. In the quarter to March 2026 households\' financial assets fell by ₹7.9 lakh crore while their debt rose by ₹7.2 lakh crore. Equity and mutual funds are 28.6% of financial assets, so market prices can move the ratio quickly.</p>'+f('per100','<b>Chart 3.1</b> · Household debt per ₹100 of financial assets, quarterly, June 2022 to March 2026.',RBI52B+'. Ratio calculated from the table.','derived')},
{k:'Net assets',h2:'Net financial assets fell from 110% of GDP to 96% in six quarters',body:'<p>Financial assets peaked at 152.2% of GDP in September 2024 and were 141.9% in March 2026, a fall of 10.3 points. Debt rose from 42.2% to 45.9%. Net financial assets fell 14.0 points. About three-quarters of that fall came from the asset side. Financial assets leave out gold and property, so this is not net worth.</p>'+f('assets_net','<b>Chart 3.2</b> · Household financial assets and net financial assets, % of GDP, quarterly, June 2022 to March 2026.',RBI52B+'. Net assets calculated as assets minus liabilities.','derived')},
{k:'The flows',h2:'In 2025-26 net savings fell and borrowing rose. Over four years they did not',body:'<p>Net financial savings were 5.3% of GDP in 2022-23, 5.8% in 2023-24, 7.1% in 2024-25 and 6.3% in 2025-26. New borrowing was 6.1%, 6.6%, 4.9% and 6.2%. "Savings down, debt up" fits only the last year.</p>'+f('flows','<b>Chart 3.3</b> · Net financial savings and new borrowing of households, % of GDP, by financial year.','RBI Bulletin, September 2026, Current Statistics Table 52(a). 2025-26 is preliminary.','primary')},
{k:'What they hold',h2:'A third of financial assets is bank deposits. Equity and funds are another 28.6%',body:'<p>Of ₹490.2 lakh crore, bank deposits are 34.4%, direct equity 18.1%, life insurance 15.7% and mutual funds 10.5%. Deposits and currency together are 42.3%. These are averages for all households.</p>'+f('asset_mix','<b>Chart 3.4</b> · Household financial assets by instrument, March 2026, % of total.',RBI52B+'. "Other" is the total less the listed instruments.','primary')}],
contested:[['₹32.3','A ratio of two stocks. It leaves out gold and property, and it moves with equity prices.'],['6.3%','2025-26 flows are preliminary and on the new 2022-23 GDP base.'],['110.0% → 96.0%','Calculated by us: the RBI\'s financial assets ratio less its liabilities ratio, both as a share of GDP.']],
takeaway:'Households are not short of assets. They are less far ahead than they were, mostly because what they hold fell back from its peak while debt kept rising. Whether the cushion is thin enough to matter depends on who holds it, and no official series says.'},

4:{kicker:'Chapter 4 · Part 2: What It Was For',title:'Beyond the Home Loan',dek:'Most household borrowing is no longer for a house.',stats:[['58.4%','Non-housing retail loans, share of household borrowing, March 2026'],['26.3%','Housing loans, share of household borrowing'],['49.7%','Share of household borrowing taken for consumption']],stand:'A home loan is backed by a house. A personal loan or a card balance is backed by nothing. The Reserve Bank\'s June 2026 Financial Stability Report shows that the second kind is now the larger part of what families owe.',sections:[
{k:'The mix',h2:'Non-housing retail loans are 58.4% of household borrowing. Home loans are 26.3%',body:'<p>The report splits household borrowing using credit bureau data. At March 2026 non-housing retail loans were 58.4%, housing loans 26.3% and agriculture and business loans taken by individuals 15.3%. Non-housing retail is a wide group. It includes personal loans, credit cards and loans against gold. A rising share does not by itself show that families borrow to consume. The report\'s second cut, by purpose, speaks to that.</p>'+f('fsr_mix','<b>Chart 4.1</b> · Household borrowing by loan type, share of the total, March 2026.',FSR+', Chart 1.56(c). The report\'s source: TransUnion CIBIL.','primary')},
{k:'The shift',h2:'Non-housing retail borrowing has grown to nearly four times its 2019 size',body:'<p>On an index with March 2019 at 100, outstanding non-housing retail borrowing stood at 376 in March 2026. Agriculture and business loans stood at 306 and housing loans at 239. The housing share has drifted down as the other two have grown faster.</p>'+f('fsr_index','<b>Chart 4.2</b> · Outstanding household borrowing by loan type, index, March 2019 = 100, at March 2026.',FSR+', Chart 1.56(d).','primary')},
{k:'The purpose',h2:'Almost half of household borrowing is for consumption',body:'<p>The report also groups loans by purpose. Consumption loans are 49.7% of the total, asset creation 33.5% and productive purposes 16.8%. Consumption loans have grown fastest: index 405 at March 2026, against 307 for productive purposes and 242 for asset creation.</p>'+f('fsr_purpose','<b>Chart 4.3</b> · Household borrowing by purpose, share of the total, March 2026.',FSR+', Chart 1.57. The report\'s sources: TransUnion CIBIL and RBI staff estimates.','primary')},
{k:'The products',h2:'Gold loans grew fastest in the year to March 2026. Credit-card balances fell',body:'<p>Among consumer-credit products, gold loans grew 54.5% in the year to March 2026. Business loans 22.9%, loans against property 20.8%, auto loans 14.1%, personal loans 12.2% and home loans 11.4%. Credit-card balances fell 5.5%. Home loans are still the largest product, at 26.3% of consumer credit. Gold loans are 11.0% and personal loans 9.6%. <a href="#/ch-5">Chapter 5</a> takes gold loans and <a href="#/ch-7">chapter 7</a> takes cards.</p>'+f('fsr_growth','<b>Chart 4.4</b> · Growth in outstanding consumer credit by product, year to March 2026, %.',FSR+', Chart 1.62(a) and (b). The report\'s sources: TransUnion CIBIL, RBI and staff estimates.','primary')},
{k:'The house',h2:'The home loans that remain are larger, and they are performing well',body:'<p>In banks\' housing portfolios, loans with a credit limit of ₹50 lakh and above are now 44.7% of the outstanding amount. In March 2014 loans below ₹25 lakh were 60.6%. Non-performing housing loans at banks fell to 0.5% in March 2026 from 1.2% in March 2019.</p>'}],
contested:[['58.4%','This is a share of the borrowing recorded in credit bureau data. It is not the same base as the RBI\'s household liabilities in Table 52, which are used elsewhere in this book. The two should not be mixed.'],['49.7%','The groups are the report\'s. Education loans count as productive and vehicle loans as asset creation. Another grouping would give different shares.'],['54.5%','It is growth in a balance. Gold loan balances rise with the gold price, as chapter 5 shows.']],
takeaway:'More than half of household borrowing is now in non-housing retail loans, and about half is for consumption. That is not itself a sign of stress, and the report records improving credit quality. It does mean that less of the debt is backed by a house.'},

5:{kicker:'Chapter 5 · Part 2: What It Was For',title:'Gold as Collateral',dek:'Loans against gold are now the largest non-housing retail product, and the fastest growing.',stats:[['+54.5%','Growth in gold loans, year to March 2026, all lenders'],['42.4%','Compound annual growth since March 2024, against 23.0% for non-housing retail loans'],['+96.5%','Growth at non-bank lenders in the year to March 2026']],stand:'Pledging gold is old and ordinary in India. What is new is the scale and the speed. This chapter uses the Reserve Bank\'s June 2026 Financial Stability Report, whose figures come from credit bureau and supervisory data.',sections:[
{k:'The size',h2:'Gold loans are 11% of consumer credit and grew 54.5% in a year',body:'<p>The report calls gold the largest segment within non-housing retail loans. It grew at a compound annual rate of 42.4% since March 2024, nearly twice the 23.0% for non-housing retail loans as a whole. At March 2026 gold loans were 11.0% of outstanding consumer credit. Non-bank lenders grew gold loans fastest: their balances rose 96.5% in the year to March 2026.</p>'+f('fsr_gold_growth','<b>Chart 5.1</b> · Growth in outstanding gold loans, by lender group, year to March 2026, %.',FSR+', Chart 1.62(c). The report\'s sources: TransUnion CIBIL, RBI and staff estimates.','primary')},
{k:'The price',h2:'Loan balances at non-banks grew faster than the price of gold',body:'<p>On an index with March 2024 at 100, gold loans at non-bank lenders stood at 250 in March 2026. The domestic gold price stood at 235. Gold loans at public-sector banks stood at 200 and at private-sector banks at 188. A higher gold price raises the amount a family can borrow against the same jewellery. Some of the growth in balances is the price, not new pledging.</p>'+f('fsr_gold_index','<b>Chart 5.2</b> · Outstanding gold loans by lender group and the gold price, index, March 2024 = 100, at March 2026.',FSR+', Chart 1.62(d). Gold price: monthly average in Mumbai.','primary')},
{k:'The borrowers',h2:'The report says existing borrowers are taking larger loans and rolling them over',body:'<p>The recent increase is driven mainly by existing borrowers, who use higher gold prices to secure larger loans and roll over existing debt. In 2025-26 gold loans written came to ₹31.0 lakh crore, against ₹18.4 lakh crore outstanding at March 2026. The value of gold loans written rose 103.4% in the year to March 2026. The number of loans written rose 32.1%. Borrowers new to credit were 5.6% of loans written.</p>'+f('fsr_gold_orig','<b>Chart 5.3</b> · Gold loans written in 2025-26 and gold loans outstanding at March 2026, ₹ lakh crore.',FSR+', Chart 1.63(b). Originations are for the financial year.','primary')},
{k:'The cushion',h2:'Banks\' loan-to-value ratio fell, so the collateral cushion widened',body:'<p>Gold loans are capped at a loan-to-value ratio of 75% to 85%. At banks the average ratio fell from 62.4% in March 2025 to 55.4% in March 2026. At a group of non-bank lenders it fell from 60.7% to 59.9%. Bad loans are rare: the gross NPA ratio on gold loans was 0.2% in March 2026. The report warns that a prolonged correction in gold prices could weaken the collateral.</p>'+f('fsr_ltv','<b>Chart 5.4</b> · Loan-to-value ratio on gold loans, March 2025 and March 2026, %.',FSR+', Chart 1.64. Non-banks: select NBFCs whose gold lending is the largest part of their portfolio.','primary')},
{k:'The signal',h2:'Sub-prime borrowers with a gold loan are cutting back personal loans',body:'<p>For borrowers who hold both, the growth of gold loans has coincided with a slower rise in personal loan balances. Sub-prime borrowers\' personal loan balances fell 10.0% in the year to March 2026, to an index of 91. These borrowers owed on average ₹4.7 lakh in gold loans and ₹1.6 lakh in personal loans. Gold loans can mean liquidity strain or cheap credit. The report does not say which.</p>'}],
contested:[['54.5% and 42.4%','One is growth in a single year. The other is a compound rate over the two years since March 2024. They measure different periods and do not conflict.'],['₹18.4 lakh crore','The report\'s figure is for all lenders and includes agriculture gold loans. Bank-only totals in the RBI\'s credit data are smaller and should not be compared.'],['₹31.0 lakh crore','It is loans written in the year, and includes loans rolled over for existing borrowers. It is not new borrowing.']],
takeaway:'Gold loans have grown from a small part of household credit to a large one in two years, and non-banks have grown them fastest. The collateral is ample and losses are low. The report\'s own caution is that this holds only while the gold price does.'},

6:{kicker:'Chapter 6 · Part 2: What It Was For',title:'Small Loans',dek:'The smallest personal loans are increasingly made by fintech lenders, and show the highest delinquency among lender types.',stats:[['56.8%','Fintech lenders\' share of personal loans below ₹50,000, March 2026'],['6.4%','Delinquency on those loans at fintech lenders (NBFCs 5.7%, banks 4.1%)'],['+41.6%','Growth in fintech lending below ₹50,000 in the year, against 20.1% for the segment']],stand:'A loan of ₹30,000 does not threaten a bank. It can threaten a household. The Reserve Bank\'s June 2026 Financial Stability Report singles these loans out.',sections:[
{k:'The lenders',h2:'Fintech lenders hold 56.8% of personal loans below ₹50,000',body:'<p>The report counts fintech firms as the lenders with a digital-first approach to lending, using TransUnion CIBIL\'s classification. They hold 56.8% of personal loans below ₹50,000, ahead of NBFCs at 30.7% and banks at 10.1%.</p>'+f('fsr_fintech_share','<b>Chart 6.1</b> · Share of personal loans below ₹50,000 by lender type, March 2026, %.',FSR+', Chart 1.50(a). The report\'s source: TransUnion CIBIL.','primary')},
{k:'The growth',h2:'Fintech lending grew 41.6% in a year while banks cut back by 30.8%',body:'<p>Personal loans below ₹50,000 grew 20.1% in the year to March 2026. Fintech lenders grew 41.6% and NBFCs 17.4%. Banks\' balances in this segment fell 30.8%.</p>'+f('fsr_small_growth','<b>Chart 6.2</b> · Growth in personal loans below ₹50,000 by lender type, year to March 2026, %.',FSR+', Chart 1.50(b).','primary')},
{k:'The stress',h2:'Delinquency is 6.4% at fintech lenders, 5.7% at NBFCs and 4.1% at banks',body:'<p>The report counts a loan as delinquent when it is 90 to 179 days past due. At March 2026 that was 6.4% of fintech lenders\' balances in this segment. Unsecured loans are about 70.5% of the fintech lenders\' books, and around half of them were made to borrowers under 35. The report says the rapid expansion has been accompanied by rising delinquencies, which signals potential asset-quality risk.</p>'+f('delinq','<b>Chart 6.3</b> · Delinquency on personal loans below ₹50,000, by lender type, March 2026, %.',FSR+', Chart 1.50(c). Loans 90 to 179 days past due as a share of the balance.','primary')},
{k:'The borrowers',h2:'One borrower in five has a sub-prime score, but they hold 9% of the amount',body:'<p>Across all household borrowing in the bureau data, borrowers with prime or better scores hold 72.0% of the amount and are 60.0% of borrowers. Sub-prime borrowers hold 9.1% of the amount and are 19.7% of borrowers. Of the sub-prime borrowers with personal loans in March 2025, 76.8% were still sub-prime a year later and 23.2% had moved up.</p>'+f('fsr_tiers','<b>Chart 6.4</b> · Household borrowing by credit-score tier, by amount and by number of borrowers, March 2026, %.',FSR+', Chart 1.59(a) and (b), and Table 1.3. Scores are TransUnion CIBIL\'s: sub-prime is 300 to 680.','primary')}],
contested:[['6.4%','It counts loans 90 to 179 days past due, so it is not the same as a gross NPA ratio. It is also not comparable with the product-level ratios in chapter 7.'],['Fintech','The report classes an NBFC as a fintech from TransUnion CIBIL\'s classification. A different classification would change the shares.'],['The trend','The report\'s chart shows delinquency for March 2024, March 2025 and March 2026 but labels only the latest. This book does not quote the earlier values.']],
takeaway:'Small loans are a small part of the balance sheet and may be a large part of the stress. The report shows the stress is highest at the newest lenders, and that the lenders are growing fastest. Whether it is spreading needs the full series.'},

7:{kicker:'Chapter 7 · Part 2: What It Was For',title:'Cards, Pay Later and the Apps',dek:'Card balances fell in 2025-26. Pay-later credit is not measured in the public data. The apps are the lenders of chapter 6.',stats:[['-5.5%','Credit-card balances, year to March 2026'],['1.4%','Gross NPA ratio on credit cards, March 2026 (2.0% a year earlier)'],['11.1%','Growth in the number of credit-active consumers, year to March 2026']],stand:'Three products blur the line between spending and borrowing. The Reserve Bank\'s report measures one of them well. This chapter says what it shows and what is not yet public.',sections:[
{k:'Cards',h2:'Card balances fell 5.5% in a year, and card losses eased',body:'<p>Credit-card balances fell 5.5% in the year to March 2026. The gross NPA ratio on credit cards fell from 2.0% to 1.4%. Cards and individual business loans have the highest bad-loan ratios of the products the report compares.</p>'+f('fsr_cards','<b>Chart 7.1</b> · Gross NPA ratio by product, consumer credit, March 2025 and March 2026, %.',FSR+', Chart 1.61(b). The report\'s source: TransUnion CIBIL.','primary')},
{k:'Pay later',h2:'The report does not mention pay-later credit',body:'<p>Pay-later credit is offered by apps and by some banks and finance companies. The Financial Stability Report does not separate it. Whether it is in the bureau figures depends on who books the loan. As far as we have found, no public series gives its balance.</p>'},
{k:'The apps',h2:'The borrowers the apps reach hold several loans',body:'<p><a href="#/ch-6">Chapter 6</a> shows that fintech lenders hold more than half of small personal loans. The report gives a partial answer on borrower-level counts. Borrowers who hold a gold loan have on average about two personal-loan accounts each: 2.17 for prime borrowers, 2.10 for near-prime and 1.79 for sub-prime.</p><p>The number of credit-active consumers grew 11.1% in the year to March 2026.</p>'}],
contested:[['-5.5%','It is a fall in the balance. A card balance includes amounts that are cleared each month, so it does not measure the share of borrowers who carry a balance. That share is not published in the report.'],['About two accounts','It is for borrowers who hold a gold loan, not for all borrowers.']],
takeaway:'Cards are the best-measured of the three, and their balances are shrinking. Pay later is not measured at all, and the app lenders are measured only as a group. Until they are counted, nobody can say whether they matter.'},

8:{kicker:'Chapter 8 · Part 3: Who Carries It',title:'The Missing Split',dek:'The RBI counts what households owe. It does not say which households. The best answer is eight years old.',stats:[['35%','Rural households in debt on 30 June 2018 (urban: 22.4%)'],['87%','Share of urban cash debt owed to institutional lenders (rural: 66%)'],['30 June 2018','Reference date of the last official survey of household debt']],stand:'Most figures in the first seven chapters are totals. A total cannot say whether the borrower is a cultivator or a salaried worker, in a village or a city. The Foundation\'s question is who is exposed, and the official series cannot answer it.',sections:[
{k:'What the RBI shows',h2:'The RBI publishes the total, the lender and the instrument, not the borrower',body:'<p>Table 52 divides ₹158.5 lakh crore of household debt between banks and other financial institutions. The Financial Stability Report divides household borrowing by loan type and reports delinquency by lender type. Neither says much about income, age, occupation or place. The one exception is a survey of ten large banks, set out below.</p>'+t(['Source','What it shows','What it cannot show'],[['NSS All India Debt and Investment Survey, 77th round','Households in debt and average debt by rural or urban and by occupation group. Institutional against other lenders. Assets.','Income bands or age in the press note. Reference date is June 2018, before the pandemic and the rise in unsecured loans.'],['RBI Bulletin, Table 52','Household assets and liabilities by instrument and lender type, quarterly.','Any split by type of household.'],['RBI Financial Stability Report, June 2026','Loan-type shares, delinquency by lender and credit-score tier, and a survey of ten large banks\' personal loans by borrower income.','Debt by income for all households. The income survey covers personal loans only.'],['RBI state-wise credit data','Credit by state, possibly by district.','Household type.']],[],640)},
{k:'The survey',h2:'The last debt survey found 35% of rural and 22.4% of urban households in debt',body:'<p>The National Sample Survey\'s 77th round measured debt as on 30 June 2018. About 35% of rural households and 22.4% of urban households were in debt. Cultivator households were likelier to be in debt: 40.3% of rural cultivator households against 28.2% of others, and 27.5% of urban self-employed against 20.6% of others.</p>'+f('nss_inc','<b>Chart 8.1</b> · Households in debt, %, rural and urban, as on 30 June 2018. By household type.',NSS+'. The rural all-household figure is given as "about 35%".','primary')},
{k:'The amount',h2:'Urban households owed twice as much: ₹1,20,336 each, against ₹59,748 in rural areas',body:'<p>Average debt per household was ₹59,748 in rural and ₹1,20,336 in urban India. For households that were in debt, the average was ₹1,70,533 in rural and ₹5,36,861 in urban areas.</p>'+f('nss_debt','<b>Chart 8.2</b> · Average debt, ₹ lakh, per household and per indebted household, as on 30 June 2018.',NSS+'.','primary')},
{k:'The lender',h2:'Two-thirds of rural debt and 87% of urban debt came from institutions',body:'<p>Institutions held 66% of outstanding cash debt in rural India and 87% in urban India. Borrowing from non-institutional lenders, a group that includes moneylenders, is outside the RBI\'s household series.</p>'+f('nss_inst','<b>Chart 8.3</b> · Institutional share of outstanding cash debt, %, rural and urban, as on 30 June 2018.',NSS+'. Cash debt only.','primary')},
{k:'A first look by income',h2:'In the banks\' own survey, borrowers earning under ₹5 lakh took a quarter of personal loans and had 44% of the fresh bad loans',body:'<p>The Financial Stability Report includes the results of a survey of ten large banks, which together hold 89% of personal loans. For nine quarters from 2023-24 to 2025-26, the banks reported personal loans and fresh non-performing loans by the borrower\'s income, in five bands.</p><p>In the quarter to December 2025, borrowers earning below ₹5 lakh took 25% of personal-loan originations and accounted for 44% of the fresh bad loans. Borrowers earning ₹5 to 10 lakh took half of the originations and had 34% of the fresh bad loans.</p>'+f('fsr_income','<b>Chart 8.4</b> · Personal loans at ten large banks, by borrower income: share of originations and share of fresh non-performing loans, quarter to December 2025.',FSR+', Box 1.2, Charts 1 and 3. The report\'s source: RBI survey responses.','primary')+'<p>Default rates are low and falling. Of personal loans disbursed to sub-prime borrowers, 1.01% had defaulted within a year at December 2025, against 0.41% for prime and 0.35% for all borrowers.</p>'+f('fsr_default','<b>Chart 8.5</b> · One-year default rate on personal loans, by credit-score tier, at December 2025, %.',FSR+', Box 1.2, Table 2. The report\'s source: RBI survey responses.','primary')+'<p>The survey is a start. It covers only personal loans and only ten banks. It does not show the income of borrowers at non-bank lenders or fintech lenders, where <a href="#/ch-6">chapter 6</a> finds the highest delinquency.</p>'},
{k:'What would settle it',h2:'What we know and what we need',body:t(['Question','What we know','What we need','Where to look'],[['Which income groups carry the debt?','For personal loans at ten large banks, originations and fresh bad loans by income band. For all debt, only the rural/urban split of 2018.','Debt by income or consumption band, for all lenders.','A newer NSS round, or bureau data with an income proxy.'],['Is the debt concentrated among the young?','Not known.','Debt and delinquency by age band.','Bureau reports by age.'],['Which kinds of worker?','Cultivator against other, self-employed against other, in 2018.','Salaried, self-employed and gig workers now.','Bureau data and the labour force survey.'],['Where?','RBI publishes bank credit by state. Not yet analysed here.','Credit and delinquency per household by state and district.','RBI state-wise credit, bureau district data. See chapter 10.'],['How much of income goes on repayment?','No published household debt-service ratio for India has been found.','A household debt-service ratio.','Build it. See chapter 9.']],[],720)}],
contested:[['35%','The press note rounds the rural figure to "about 35%". The urban figure is given exactly, as 22.4%.'],['30 June 2018','Debt is as on that date, before the pandemic, the growth of fintech lending and the rise in gold and small unsecured loans. It cannot be used to describe the debt of 2026.'],['66% and 87%','They are shares of outstanding cash debt. Loans in kind are not counted.'],['44%','It is the share of fresh non-performing loans, not a default rate. A band that took 25% of originations can have a larger share of bad loans because its loans are older or riskier.']],
takeaway:'The Foundation can say how much India\'s households owe and who lent it. It cannot yet say who owes it. The only survey of all household debt is eight years old and pre-dates the loans now growing fastest. The banks\' survey gives a first look by income, for personal loans only. The case for a better table starts here.'},

9:{kicker:'Chapter 9 · Part 3: Who Carries It',title:'What the EMI Takes',dek:'Debt matters through what it costs each month. For India\'s households that number has not been published, so this chapter shows what it would take to estimate it.',stats:[['11.7%','Debt service ratio of India\'s private non-financial sector, September 2025 (average since 2013: 12.2%)'],['8% to 15%','Range of annual debt service as a share of GDP if household debt is repaid over 4 to 8 years at 9% to 13%'],['None found','Published household debt service ratio for India']],stand:'A family with a large debt and a long loan may pay little each month. A family with a small debt and a short one may pay most of its income. The ratio of debt to GDP says neither. The Foundation does not claim to measure the ratio. It shows what the data allow and what they do not.',sections:[
{k:'The measure',h2:'The debt service ratio is the share of income that goes on repayments',body:'<p>The debt service ratio counts interest and principal paid in a period, set against income. The BIS publishes it for the private non-financial sector of many countries and for households in 17 of them. In the table of household ratios that we could read, India is not among the 17.</p>'},
{k:'What exists',h2:'The one Indian ratio covers households and companies together, and stands near its average',body:'<p>The Reserve Bank\'s June 2026 Financial Stability Report charts the debt service ratio of India\'s private non-financial sector, which combines households and companies. It was 11.7% in September 2025, against an average of 12.2% for 2013 to 2025. This is not a household ratio. Households have different incomes, debt and loan lengths from companies.</p>'+f('fsr_dsr','<b>Chart 9.1</b> · Debt service ratio, India\'s private non-financial sector, September 2025 and the 2013 to 2025 average, %.',FSR+', Chart 1.53(c). The report\'s sources: BIS, Capitaline and RBI staff estimates.','primary')},
{k:'Building one',h2:'A rough household figure depends far more on how long loans last than on the interest rate',body:'<p>The table shows what the household financial liabilities of ₹158.5 lakh crore would cost each year, as a share of GDP, if all of it were repaid in equal monthly instalments over a stated number of years. GDP stands in for income; real loans differ sharply by type and term. This is arithmetic on assumptions, not a measurement.</p>'+t(['Interest rate','Repaid over 4 years','Repaid over 6 years','Repaid over 8 years'],[['9%','13.7%','9.9%','8.1%'],['11%','14.2%','10.5%','8.7%'],['13%','14.8%','11.1%','9.3%']],[1,2,3],520)+'<p>A four-point change in the interest rate moves the result by about one point of GDP. A change in repayment length from four years to eight moves it by about six. The length of loans is therefore the number to find.</p>'},
{k:'By income',h2:'The burden by income is the figure the policy debate needs',body:'<p>If the repayment burden falls on households with high incomes and large assets, a rise in debt is a smaller worry. If it falls on households with low or uncertain incomes, it is a larger one. <a href="#/ch-8">Chapter 8</a> shows the one public cut by income: at ten large banks, borrowers earning under ₹5 lakh took a quarter of personal loans and had 44% of the fresh bad loans. It does not show instalments against income. <a href="#/ch-15">Chapter 15</a> sets out what that table would contain.</p>'}],
contested:[['11.7%','It is for the whole private non-financial sector, and the report shows it in its section on companies. It is not a household ratio.'],['8% to 15%','The range assumes level instalments, a single repayment length and GDP as income. It is a method, not a finding.'],['17 countries','The count of household ratios is from the BIS table we could read, which is an older copy ending in 2017. The current dataset may differ.']],
takeaway:'No one can say today what share of income India\'s households pay on their loans. The nearest published figure covers companies as well, and the rough household estimate swings with how long loans last. Closing the gap needs loan terms and incomes, and the bureaus hold both.'},

10:{kicker:'Chapter 10 · Part 3: Who Carries It',title:'Where the Debt Lives',dek:'The last survey of household debt by state found it concentrated in the south, and in rural Telangana, Andhra Pradesh and Kerala.',stats:[['67.2%','Rural households in debt in Telangana, 2019 (all-India rural: 35.0%)'],['47.8%','Urban households in debt in Kerala, 2019 (all-India urban: 22.4%)'],['2019','Reference year of the latest state-wise survey data']],stand:'Credit differs across states with income, banking and the mix of lenders. The only public state-level measure of household debt is the National Sample Survey of 2019, as tabulated by India Ratings. This chapter shows it and says how old it is.',sections:[
{k:'The map',h2:'In 2019 the share of households in debt ranged from about 5% to 67%, and the southern states led',body:'<p>Nagaland had the lowest share of rural households in debt, at 6.6%, and Meghalaya the lowest urban, at 5.1%. Telangana had the highest rural share at 67.2%, followed by Andhra Pradesh at 62.8% and Kerala at 54.5%. The all-India rural figure was 35.0%.</p>'+f('nss_state_rural','<b>Chart 10.1</b> · Rural households in debt, five southern states and all-India, 2013 and 2019, %.','India Ratings, from the NSS All India Debt and Investment Surveys of 2013 and 2019 (reported 28 September 2021). All-India values agree with the Ministry of Statistics\' 2019 press note.','comp')+'<p>In towns, Kerala led at 47.8%, followed by Andhra Pradesh at 44.9%. Telangana\'s urban share was 30.2%, Tamil Nadu\'s 26.6% and Karnataka\'s 22.6%.</p>'+f('nss_state_urban','<b>Chart 10.2</b> · Urban households in debt, five southern states and all-India, 2013 and 2019, %.','India Ratings, from the NSS surveys of 2013 and 2019 (reported 28 September 2021).','comp')},
{k:'The change',h2:'Between 2013 and 2019 rural debt grew in most of these states, and urban debt fell in Tamil Nadu',body:'<p>In rural India the share in debt rose by 8.7 points in Andhra Pradesh, 8.1 in Telangana, 5.0 in Kerala and 1.7 in Karnataka. It fell 2.8 points in Tamil Nadu. In urban India it rose 5.1 points in Andhra Pradesh and 0.9 in Kerala, and fell in Tamil Nadu (8.2), Karnataka (3.9) and Telangana (0.3).</p>'},
{k:'The limits',h2:'The map is seven years old and shows only whether a household borrowed',body:'<p>The 2019 survey predates the pandemic and the growth of gold, fintech and small unsecured lending. It counts households in debt, not the amount owed or the strain of repayment. A share of households in debt can be high where credit is easy to get, which may mean access and not stress. The Reserve Bank publishes credit by state for banks, and credit bureaus hold it by district. As far as we have found, neither gives household debt by state in a form the public can use. <a href="#/ch-15">Chapter 15</a> sets out the table that would.</p>'}],
contested:[['The state figures','They are taken from India Ratings\' tabulation of the survey, not from the Ministry\'s own tables, which we could not obtain. The all-India values match the Ministry\'s press note, which is a check on the tabulation.'],['Five states','This chapter shows the five states the tabulation reports. Other states are not shown.'],['Share in debt','It is the share of households with any outstanding debt on the reference date. It says nothing about the size of the debt.']],
takeaway:'Household debt differs sharply across states, and the 2019 survey puts the south at the top. It is the last time the country measured the map. How much has changed since gold and app lending spread is unknown.'},

11:{kicker:'Chapter 11 · Part 3: Who Carries It',title:'Assets Behind the Debt',dek:'Most of what families own is not in the RBI\'s balance sheet. It is land, buildings and gold.',stats:[['69%','Land\'s share of rural household assets, 2018 (urban: 49%)'],['₹15.9 lakh','Average value of assets per rural household, 2018'],['₹27.2 lakh','Average value of assets per urban household, 2018']],stand:'The RBI\'s ratio sets debt against financial assets. For most Indian households the largest asset is land or a house. Which yardstick is used changes the answer a great deal.',sections:[
{k:'The assets',h2:'In rural India, land was 69% of household assets. In urban India, land and buildings were 87%',body:'<p>The 2018 survey gives average assets of ₹15,92,379 per rural household and ₹27,17,081 per urban household. In rural India, land was 69% of the total, buildings 22%, deposits 5% and other assets 4%. In urban India, land was about 49%, buildings 38%, deposits 9% and other assets 4%.</p>'+f('nss_assets','<b>Chart 11.1</b> · Share of the value of household assets, %, by type of asset, rural and urban, as on 30 June 2018.',NSS+'.','primary')},
{k:'Two denominators',h2:'Average debt was about 4% of average assets in 2018. Against financial assets alone it is 32% today',body:'<p>Set against the survey\'s average assets, the average debt of ₹59,748 in rural and ₹1,20,336 in urban India was 3.8% and 4.4% of assets. Against the financial assets in the RBI\'s balance sheet, debt per ₹100 is ₹32.3 in March 2026. The two figures cannot be compared. They cover different years, count different assets and average over different groups.</p>'},
{k:'The missing view',h2:'The balance sheet by wealth group is the picture the book needs',body:'<p>If debt is held by households with land and gold, a fall in prices matters less than a fall in income. If it is held by households with neither, the position is very different. The survey\'s unit-level data could show this. They have not yet been analysed.</p>'}],
contested:[['69%','The asset values come from the survey\'s press note. How land and buildings were valued is set out in the survey report, which we have not reviewed.'],['3.8% and 4.4%','Calculated by us as the ratio of two averages from the press note. It is not a published figure.'],['₹32.3 against 4%','Different denominators, years and groups. Presented together to show how much the yardstick matters, not to compare.']],
takeaway:'Debt looks very different against financial assets and against all assets. Most of what families own is land and buildings, and the RBI\'s ratio leaves it out. Which view is right depends on whether the question is about liquidity or about wealth.'},

12:{kicker:'Chapter 12 · Part 4: What Could Break',title:'Three Shocks',dek:'A stress test asks what a plausible shock would do to repayments. Here, three shocks to one stylised household and one check on gold.',stats:[['36.0% to 38.6%','Instalment as a share of income after a 1-point rise in the rate (stylised household)'],['60.0%','The same share after one of two earners loses work'],['26%','Fall in the gold price that takes the average bank gold loan to the 75% loan-to-value cap']],stand:'Part IV asks what could break. The household in this chapter is invented, and the results are illustrations, not forecasts. The gold check is arithmetic on the Reserve Bank\'s own averages. No result here is a count of real borrowers.',sections:[
{k:'The method',h2:'Each scenario changes one input and asks how the instalment compares with income',body:'<p>A scenario changes one input: the interest rate, household income, or the number of earners. The output is the instalment as a share of income. A household is in difficulty when that share passes a threshold. The right threshold varies by household, so the chapter shows the share and leaves the threshold to the reader. Counting how many real borrowers would cross a threshold needs the spread of instalments and incomes across households. That data is not public.</p>'},
{k:'A worked example',h2:'Losing an earner moves the burden more than nine times as much as a one-point rate rise',body:'<p>Take a household with a monthly income of ₹50,000 and a ₹20 lakh home loan over 20 years at 9%. The instalment is ₹17,995, or 36.0% of income.</p>'+t(['Scenario','Monthly income','Instalment','Instalment as % of income'],[['Base case','₹50,000','₹17,995','36.0%'],['Interest rate up 1 point, to 10%','₹50,000','₹19,300','38.6%'],['Income falls 10%','₹45,000','₹17,995','40.0%'],['One earner (₹20,000 of the ₹50,000) loses work','₹30,000','₹17,995','60.0%']],[1,2,3],560)+f('shock_emi','<b>Chart 12.1</b> · Instalment as a share of income, one stylised household, four scenarios, %.','Foundation arithmetic on an invented household: ₹20 lakh loan, 20 years, 9%, income ₹50,000 a month. Not data.','illus')+'<p>The rate rise adds 2.6 points to the burden. The 10% income fall adds 4.0. Losing the earner adds 24.0. Lenders often lengthen the term instead of raising the instalment when rates rise, which keeps the instalment lower and the loan longer.</p>'},
{k:'Scale',h2:'If every rupee of household debt repriced by a point, the extra interest would be about 0.5% of GDP',body:'<p>Household financial liabilities were ₹158.5 lakh crore at March 2026, 45.9% of GDP. A one-point rise on all of it would add ₹1.6 lakh crore a year in interest, about 0.46% of GDP. Net financial savings were 6.3% of GDP in 2025-26, so the extra interest would equal about 7% of them. This is an upper bound. Much of household debt is at fixed rates or reprices slowly.</p>'},
{k:'The collateral check',h2:'The gold price would have to fall by a quarter before the average bank loan reached its cap',body:'<p><a href="#/ch-5">Chapter 5</a> shows that banks\' gold loans averaged 55.4% of the value of the gold at March 2026, and a group of non-bank gold lenders averaged 59.9%. Loans are capped at 75% to 85%. If the average ratio is today\'s ratio, the gold price would have to fall by 26% for the average bank loan to reach 75% and by 35% to reach 85%. For the non-bank group the falls are 20% and 30%. Averages hide the loans that sit well above the average.</p>'+f('shock_gold','<b>Chart 12.2</b> · Fall in the gold price at which the average gold loan reaches the loan-to-value cap, %.','Foundation arithmetic on '+FSR+', Chart 1.64: average LTV of 55.4% (banks) and 59.9% (select NBFCs). Fall = 1 minus average LTV divided by cap.','derived')}],
contested:[['36.0% to 60.0%','The figures are for an invented household. The loan size, rate and term are assumptions.'],['The threshold','Whether trouble starts at 40%, 50% or 60% of income depends on the household. No threshold is chosen here.'],['0.46% of GDP','It assumes the whole stock of household financial liabilities reprices at once. That overstates the effect.'],['26% and 35%','They treat the report\'s average ratio as the current ratio of every loan. The distribution around the average is not published.']],
takeaway:'A shock does not hit all borrowers alike. The one that removes an earner matters most for a household with a single large loan. How many households are in that position, and how far their gold loans sit from the cap, are data questions that the public record cannot yet answer.'},

13:{kicker:'Chapter 13 · Part 4: What Could Break',title:'When the Pay Stops',dek:'Young borrowers hold a large share of the newest small loans. Youth unemployment is rising. The public data do not yet join the two.',stats:[['15.9%','Unemployment rate, ages 15 to 29, April to June 2026 (14.6% a year earlier)'],['18.2%','Urban youth unemployment, April to June 2026; 25.2% for urban young women'],['About half','Share of fintech lenders\' unsecured loans that went to borrowers under 35']],stand:'A first salary pays the first loans of a working life. This chapter sets the best public figures on young people\'s work beside the best public figures on young people\'s loans, and says what cannot yet be joined.',sections:[
{k:'The channel',h2:'A first salary pays an education loan and the first instalments',body:'<p>A graduate in a job often repays an education loan, rents a flat and starts to borrow for a vehicle or a first home. Family members may lean on the same salary. When entry-level work is scarce, those obligations do not slow with it.</p>'},
{k:'The work',h2:'Youth unemployment rose to 15.9% in April to June 2026, from 14.6% a year earlier',body:'<p>The government\'s Periodic Labour Force Survey measures unemployment by the current weekly status. For ages 15 to 29 the rate was 15.9% in April to June 2026. A year earlier it was 14.6%. The rate for all ages from 15 was 5.4% in both quarters. Among the young, rural unemployment rose from 13.1% to 14.7% and urban unemployment from 17.9% to 18.2%. For urban young women the rate was 25.2% in April to June 2026.</p>'+f('plfs_youth','<b>Chart 13.1</b> · Unemployment rate, ages 15 to 29, current weekly status, April to June 2025 and April to June 2026, %.','MoSPI, Periodic Labour Force Survey, quarterly bulletins for April to June 2025 (Annexure I) and April to June 2026 (Statement 5).','primary')},
{k:'Tech hiring',h2:'Employment in the technology sector is growing slowly, and the largest firm shrank',body:'<p>Nasscom estimated in February 2026, as reported by PTI, that Indian technology employment would end FY26 at 59.5 lakh after a net addition of 1.35 lakh. That is jobs growth of 2.3%, while revenue was expected to grow 6.1% to $315 billion. TCS, the largest employer, reported a headcount of 5,84,519 at the end of FY26, a fall of 23,460 or 3.9%, according to Business Today in April 2026. These two sources are news reports of the releases, not the releases themselves. This book does not attribute the slowdown to artificial intelligence.</p>'},
{k:'The loans',h2:'Young borrowers hold a large share of the newest small loans',body:'<p>The Reserve Bank\'s June 2026 Financial Stability Report says unsecured loans are about 70.5% of fintech lenders\' books and that around half of them went to borrowers under 35. Delinquency on those lenders\' small loans is 6.4% (<a href="#/ch-6">chapter 6</a>). The number of credit-active consumers grew 11.1% in the year to March 2026 (<a href="#/ch-7">chapter 7</a>).</p>'},
{k:'The gap',h2:'No public series joins a young borrower\'s work to the repayment of the loan',body:'<p>To test the link, the data need loan performance by age and by sector of work. The bureaus hold it. The Reserve Bank\'s report shows delinquency by lender type and credit score but not by age. Until it is published, the two sets of figures sit side by side and the link is a question.</p>'}],
contested:[['15.9% against 14.6%','Both are from quarterly bulletins under the survey\'s revised design, which began in January 2025. The change is one year apart in the same quarter, which avoids seasonal effects.'],['Nasscom\'s figures','They are estimates published in February 2026 and are quoted here as reported by PTI. Nasscom\'s own document could not be read.'],['TCS','The headcount and its fall are as reported by Business Today. The company\'s filing has not been read.'],['About half','The report says around half of fintech lenders\' unsecured loans were extended to borrowers under 35. It does not give the exact share.']],
takeaway:'Young people\'s unemployment has risen while the newest and smallest loans are going to young borrowers. That is a risk, not a measured loss. Counting it needs loan performance by age and sector, which the bureaus hold and the public cannot see.'},

14:{kicker:'Chapter 14 · Part 5: What to Measure',title:'Ten Numbers to Watch',dek:'A quarterly tracker of ten indicators, each with its latest value, its trend and a peer anchor.',stats:[['9 of 10','Indicators with a value today, from primary data or our arithmetic on it'],['1 of 10','Pending: no published household debt-service ratio for India has been found'],['Quarterly','Update rhythm, within weeks of each RBI and BIS release']],stand:'The first chapters show a picture that will move. The tracker is the part of this book that is updated, within weeks of each RBI and BIS release.',sections:[
{k:'The panel',h2:'Nine of the ten indicators have a value today. One is pending',body:'<p>Each row has the latest value and its date, the change over twelve months, a short trend line, a peer anchor where one exists and the evidence behind it. A pending indicator has no value on the page. It will appear when a source has been found and checked.</p><div class="chart" data-chart="panel"></div><p class="note" style="font-size:13px;margin-top:4px">As at 20 October 2026.</p>'},
{k:'The rhythm',h2:'The tracker updates within weeks of each release',body:'<p>The RBI\'s household balance sheet is quarterly. March 2026 data first appeared in the July 2026 Bulletin. The BIS series is updated on its own schedule, and its last release carried December 2025.</p><p>Each update adds a row to a shared data sheet, with its source, vintage, evidence tag and the date it was checked.</p>'},
{k:'How to read it',h2:'Each indicator answers one question',body:'<p>The two debt ratios ask how much. The BIS peer anchor asks how India compares. Debt per ₹100 of financial assets and net financial assets ask how thick the cushion is. The two flows ask what happened this year. The loan-mix indicator asks what the money is for. The gold-loan and small-loan indicators ask where the stress may show first. The pending indicator asks what the debt costs each month.</p><p>No one indicator is the answer. The tracker is meant to be read as a set, and a move in one with no move in the rest is more likely to be noise.</p>'}],
contested:[['9 of 10','Counting an indicator as populated says nothing about how good its source is. All nine rest on primary data or on arithmetic we show. Three come from the Financial Stability Report, whose figures are for a single date and carry no earlier value we can quote.'],['Peer anchors','Only the BIS measure has one. The others will get peer anchors as sources are found.'],['The ten','The Foundation chose these ten indicators, and the list may change as better sources appear.']],
takeaway:'The tracker turns this book from a picture into a series. Every number on it has a source and a date, and the one that does not yet is shown as pending, not estimated.'},

15:{kicker:'Chapter 15 · Part 5: What to Measure',title:'The Table That Does Not Exist',dek:'The RBI could publish debt by income band, age and occupation in the release it already makes.',stats:[['6','Age groups in the New York Fed\'s quarterly household debt report: 18 to 29 up to 70 and over'],['5','Wealth groups in the Federal Reserve\'s distributional accounts'],['1989','Year the Fed\'s distributional series begins (third quarter)']],stand:'Part III built proxies and said what each cannot show. The remedy is not a better proxy. It is a better table. This chapter says what it would contain and where the model exists.',sections:[
{k:'The ask',h2:'The RBI could add a split of household debt by group to its quarterly release',body:'<p>The Foundation\'s ask is the output: debt, borrowers and stress by income band, age band, occupation and state.</p>'+t(['Group','Share of households','Share of debt','Debt per household','Share delinquent','Debt service ratio'],[['Income band: lowest, middle, highest','—','—','—','—','—'],['Age band: under 30, 30 to 44, 45 to 59, 60 and over','—','—','—','—','—'],['Occupation: salaried, self-employed, cultivator, other','—','—','—','—','—'],['State','—','—','—','—','—']],[1,2,3,4,5],720)+'<p class="note" style="margin-top:8px">This is a mock-up of the layout. It has no figures. The bands are examples and would be set with the RBI.</p>'},
{k:'Models',h2:'The New York Fed splits household debt by age, state and credit score. The Federal Reserve splits household wealth by group',body:'<p>The Federal Reserve Bank of New York\'s quarterly Household Debt and Credit report gives balances by loan type, by age group (18 to 29, 30 to 39, 40 to 49, 50 to 59, 60 to 69 and 70 and over), by state and by credit score for originations. It also reports flows into delinquency by loan type, age and state. Of outstanding US household debt, 4.7% was in some stage of delinquency at the end of June 2026.</p><p>The Federal Reserve\'s Distributional Financial Accounts split household wealth into five groups by wealth percentile, and also give wealth by income, age, generation, education and race. The series begins in the third quarter of 1989.</p>'+t(['Split','RBI today','New York Fed','Federal Reserve'],[['By lender or instrument','Yes, in Table 52','Yes, by loan type','Yes, assets and liabilities by type'],['By age','No','Yes, six age groups','Yes, by age and generation'],['By income','Only in a survey of ten large banks\' personal loans (June 2026 report)','Not as a split of balances','Yes'],['By place','Not for household debt','Yes, by state','No'],['By wealth','No','No','Yes, five groups'],['Delinquency','By lender type and product in the Financial Stability Report','Yes, by loan type, age and state','Not applicable']],[],720)},
{k:'The lesson',h2:'The split is an output of a release that already exists',body:'<p>Neither model is a survey. The New York Fed\'s report is built from credit bureau records. The Federal Reserve\'s accounts distribute totals it already compiles across groups, using survey data. India has the same ingredients. The RBI compiles the totals. Credit bureaus hold loan-level records, and the RBI\'s June 2026 survey of ten large banks shows that income-level data can be collected. What is missing is a decision to publish the split.</p>'}],
contested:[['The US models','They are a guide to what a split could look like, not a template. The US has a different credit reporting system and a different survey base.'],['The New York Fed states','The report shows a set of states, not all of them. This book quotes none of the state values.'],['Feasibility','The cost and feasibility of the split for the RBI are not assessed here.']],
takeaway:'The ask is small: a split added to a release that already exists. It would let the next book on household debt answer the question this one cannot.'}
    };
    return chapters[n]||null;
  }

  buildEpilogue(){
    return '<article>'+this.chead('Epilogue','The 2030 Household Report Card','Seven measures, each with its value today and the direction that would count as progress.',this.stat('45.9%','Household debt to GDP, March 2026 (RBI)')+this.stat('₹32.3','Debt per ₹100 of financial assets, March 2026')+this.stat('6.3%','Net financial savings, % of GDP, 2025-26'),'The card names the measures and the direction that counts as better. It sets no numerical targets.')+
    this.sec('The card','Six of the seven measures have a value today','<p>The first six are in the tracker in <a href="#/ch-14">chapter 14</a>. The seventh is the subject of <a href="#/ch-15">chapter 15</a>.</p>'+this.tbl(['Measure','Latest','Better means'],[['Household debt, % of GDP (RBI)','45.9% (March 2026)','Flat or falling'],['Debt per ₹100 of financial assets','₹32.3 (March 2026)','Falling'],['Net financial savings, % of GDP','6.3% (2025-26, preliminary)','Rising'],['Delinquency on small personal loans, fintech lenders','6.4% (March 2026)','Falling'],['Non-housing share of household borrowing','58.4% (March 2026)','Not rising faster than incomes'],['Household debt service ratio','No published figure','Stable or falling'],['Debt published by household type','Only for personal loans at ten banks, by income','Yes, for all loans, in the quarterly release']],[],640))+
    this.sec('The test','The book will have done its job if the last row changes','<p>Most of the first six measures depend on what households and the economy do. The seventh depends on a decision. A split of household debt by group, published each quarter, would let every other measure here be read with more care.</p>')+
    this.sec('2030','What the country should be able to say by 2030','<p>Three things. How much of household income goes on loan repayments, and for whom. Whether the fastest-growing loans, gold and small unsecured credit, are performing as well as the older ones. And which households and which states carry the debt, measured since the pandemic and not before it.</p>')+
    this.take('Household debt is a number about the future. The book\'s aim is that by 2030 the country can say who holds it.')+
    this.pager({k:'ch-15',dir:'Chapter 15',title:'The Table That Does Not Exist',ts:'The RBI could publish debt by income band, age and occupation.'},{k:'appendix',dir:'Appendix',title:'Method and Sources',ts:'How the numbers were built, where they came from and what is still open.'})+'</article>';
  }

  buildAppendix(){
    return '<article><header class="chead"><div class="kicker">Appendix</div><h1>Method and Sources</h1><p class="dek">How the numbers were built, where they came from and what is still open.</p></header>'+
    this.sec('A · Measures','Several household-debt figures are in circulation, and the book uses one for each purpose',this.tbl(['Measure','Date','% of GDP','Use in this book'],[['RBI Bulletin, household financial liabilities, September 2026 edition','March 2026','45.9','Headline. Latest vintage.'],['RBI Bulletin, August 2026 edition','March 2026','45.8','Superseded by revision.'],['BIS credit to households and non-profit institutions','December 2025','47.8','Long-run comparison and peers.'],['RBI Financial Stability Report, June 2026, Chart 1.56(a)','September 2025','45.5','The report\'s BIS-based series. It equals the BIS value for Q3 2025 in the series used here, so the two agree.']],[2],640)+'<p>The Financial Stability Report\'s loan-mix figures (chapters 4 to 7) come from credit bureau data. Their base differs from the RBI\'s household liabilities, so they are not added to or divided by the Table 52 figures.</p>')+
    this.sec('B · Evidence tags','Every chart carries an evidence tag','<div style="display:flex;flex-direction:column;gap:10px;margin-top:4px"><p>'+this.tier('primary')+' Read from the original release.</p><p>'+this.tier('derived')+' Our arithmetic on primary data. The formula is in section C.</p><p>'+this.tier('comp')+' Primary survey data as tabulated by a named third party. Used in chapter 10, where the all-India values are checked against the Ministry\'s own release.</p><p>'+this.tier('illus')+' An example on an invented household or case. Used in chapters 9 and 12 and labelled each time.</p><p>Figures seen only in news coverage of an original we have not read are not used in this release, with two exceptions in chapter 13: Nasscom\'s FY26 estimates and TCS\'s headcount. They are named there as news reports of the release.</p></div>')+
    this.sec('C · Calculations','The derived figures use these formulas','<ul class="sources"><li>Implied nominal GDP = household financial liabilities ÷ the RBI\'s liabilities-to-GDP ratio.</li><li>Debt per ₹100 of financial assets = financial liabilities ÷ financial assets × 100.</li><li>Net financial assets, % of GDP = financial assets ratio − liabilities ratio.</li><li>Net financial savings = gross financial assets added − new borrowing (Table 52(a)).</li><li>Peer change = BIS ratio in Q4 2025 − ratio in Q4 2024.</li><li>NSS ratios = average debt per household ÷ average value of assets per household, rural and urban separately.</li></ul>')+
    this.sec('D · What comes next','The book is complete, and several figures can be improved','<ul class="sources"><li>Time series behind the Financial Stability Report\'s charts. The report labels only the latest values on most of them.</li><li>The full lender and instrument breakdown in the RBI\'s Table 52(b).</li><li>State-wise household credit from the RBI and credit bureaus, and the Ministry\'s own state tables for the 2019 survey.</li><li>Loan terms and instalments from the bureaus, for a measured household debt service ratio.</li><li>Loan performance by age and by sector of work, and the Nasscom and TCS originals, for chapter 13.</li></ul>')+
    '<section class="sec"><div class="kicker">E · Sources</div><h2>Sources used in this release</h2><ul class="sources"><li><a href="https://rbi.org.in/Scripts/BS_ViewBulletin.aspx?Id=24506">RBI Bulletin, 25 September 2026, Table 52(b)</a> and <a href="https://rbi.org.in/Scripts/BS_ViewBulletin.aspx?Id=24505">Table 52(a)</a> (primary)</li><li><a href="https://fred.stlouisfed.org/series/QINHAM770A">FRED: Total Credit to Households and NPISHs, India (BIS)</a>; peers: <a href="https://fred.stlouisfed.org/series/QCNHAM770A">China</a>, <a href="https://fred.stlouisfed.org/series/QBRHAM770A">Brazil</a>, <a href="https://fred.stlouisfed.org/series/QIDHAM770A">Indonesia</a>, <a href="https://fred.stlouisfed.org/series/QTHHAM770A">Thailand</a>, <a href="https://fred.stlouisfed.org/series/QKRHAM770A">Korea</a>, <a href="https://fred.stlouisfed.org/series/QUSHAM770A">United States</a> (primary)</li><li><a href="https://www.mospi.gov.in/sites/default/files/press_release/press_note-AIDIS-240821.pdf">MoSPI press note, All India Debt and Investment Survey, NSS 77th round</a> (primary)</li><li>RBI, <i>Financial Stability Report</i>, June 2026, chapter 1 and Box 1.2 (primary)</li><li>India Ratings, <i>Household Indebtedness and Leverage Higher in South Indian States</i>, 28 September 2021, from NSS surveys of 2013 and 2019 (compiled)</li><li>MoSPI, Periodic Labour Force Survey quarterly bulletins, April to June 2025 and April to June 2026 (primary)</li><li>News reports used in chapter 13: PTI on Nasscom\'s FY26 estimates, 24 February 2026; Business Today on TCS headcount, 15 April 2026</li><li><a href="https://publicpolicy.growthoriginator.in/book/">Public Policy Foundation, Rich Country, Poor Citizens</a> (the first book; the income figure in chapter 2)</li></ul></section>'+
    this.sec('F · Corrections','Corrections','<p>None yet. Corrections to published figures will be listed here with the date and what changed.</p>')+
    this.pager({k:'epilogue',dir:'Epilogue',title:'The 2030 Household Report Card',ts:'Seven measures and the direction that counts as progress.'},null)+'</article>';
  }

  /* ── LIFECYCLE ── */
  componentDidMount(){
    this._tip=document.getElementById('tip');
    const tog=document.getElementById('ttog');
    if(tog){const isDark=()=>document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&window.matchMedia('(prefers-color-scheme:dark)').matches);tog.textContent=isDark()?'☀':'☽';tog.addEventListener('click',()=>{const d=isDark();document.documentElement.setAttribute('data-theme',d?'light':'dark');tog.textContent=d?'☽':'☀';});}
    this._scroll=()=>{const d=document.documentElement,h=d.scrollHeight-d.clientHeight,p=document.getElementById('prog');if(p&&h>0)p.style.width=(d.scrollTop/h*100)+'%';};
    window.addEventListener('scroll',this._scroll,{passive:true});
    this._route=()=>this.renderPage();
    window.addEventListener('hashchange',this._route);
    this.renderPage();
  }
  componentWillUnmount(){window.removeEventListener('hashchange',this._route);window.removeEventListener('scroll',this._scroll);this._ro.forEach(o=>o.disconnect());this._ro=[];}

  renderPage(){
    this._ro.forEach(o=>o.disconnect());this._ro=[];
    this.hideTip();
    const key=(location.hash.replace(/^#\/?/,'')||'home');
    const k=this.PAGES[key]?key:'home';
    const main=document.getElementById('main');
    if(!main)return;
    main.innerHTML=this.buildPage(k);
    main.querySelectorAll('[data-chart]').forEach(h=>{const f=this.R[h.dataset.chart];if(f)f(h);});
    document.title=(this.PAGES[k]||'Home')+' · The Household Balance Sheet';
    document.querySelectorAll('.sitebar a[data-k]').forEach(a=>{if(a.dataset.k===k)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
    const prog=document.getElementById('prog');if(prog)prog.style.width='0%';
    window.scrollTo(0,0);main.focus({preventScroll:true});
  }

  renderVals(){return{};}
}
