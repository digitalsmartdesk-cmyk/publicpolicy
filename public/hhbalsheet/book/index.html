    return '<article><section class="hero"><div class="eyebrow">Public Policy Foundation · Second book</div><h1>The Household Balance Sheet</h1><p class="sub">What Indian families owe, 2022–2030</p><p class="stand">Indian families have borrowed faster than the economy has grown. The country counts the total. It does not yet count who carries it.</p><div class="stats">'+this.stat('45.9%','Household debt, % of GDP, March 2026 (RBI)')+this.stat('47.8%','BIS measure, December 2025: highest since series began in 2007')+this.stat('78% v 41%','Growth in household debt against growth in GDP, June 2022–March 2026')+this.stat('5th of 7','India\'s rank among its seven-country peer panel')+'</div><div class="btns"><a class="btn" href="#/prologue">Start reading →</a><a class="btn ghost" href="#/contents">Contents</a><a class="btn ghost" href="#/charts">Charts</a></div></section>'+

    part(3,'8–11','Who Carries It','The RBI counts what households owe. It does not say which households.','ch-8')+

    '</div></section>'+
    this.sec('One picture','Debt grew 78%. The economy grew 41%.','<p>Household debt against GDP and financial assets, June 2022 to March 2026, indexed to 100. <a href="#/ch-1">Read chapter 1 →</a></p>'+this.fig('indexed','Household financial liabilities, financial assets and nominal GDP, index, June 2022 = 100.','RBI Bulletin, September 2026, Table 52(b). GDP implied from the liabilities ratio.','derived'))+'</article>';

  buildContents(){

    const part=(n,name,desc,items)=>'<section class="sec"><div class="part"><div class="ph"><div class="kicker">Part '+n+'</div><h2>'+name+'</h2><p class="pdesc">'+desc+'</p></div><ul class="chlist">'+items+'</ul></div></section>';
    return '<article><header class="chead"><div class="kicker">Full contents</div><h1>The Household Balance Sheet</h1><p class="dek">What Indian families owe, 2022–2030</p></header>'+
    '<section class="sec"><ul class="chlist">'+ch('P','prologue','The Ledger','What Indian families owe, what they own, and what nobody has yet counted.')+'</ul></section>'+
    part(1,'Borrowed Fast','India\'s households are borrowing faster than the economy grows, on two independent measures.',ch(1,'ch-1','Borrowing Outran the Economy','Household debt grew 78% in under four years. The economy it sits on grew 41%.')+ch(2,'ch-2','Fifth of Seven','India\'s households owe less than four of their six peers. They are borrowing faster than any of them.','Part')+ch(3,'ch-3','A Thinner Cushion','Families still own three times what they owe. For every ₹100 of financial assets they now owe ₹32.'))+
    part(2,'What It Was For','More than half of what families borrow is no longer for a house.',ch(4,'ch-4','Beyond the Home Loan','Most household borrowing is no longer for a house.')+ch(5,'ch-5','Gold as Collateral','Loans against gold are now the largest non-housing retail product, and the fastest growing.')+ch(6,'ch-6','Small Loans','The smallest personal loans are increasingly made by fintech lenders, and show the highest delinquency.')+ch(7,'ch-7','Cards, Pay Later and the Apps','Card balances fell in 2025-26. Pay-later credit is not measured in the public data.','Part'))+
    part(3,'Who Carries It','The RBI counts what households owe. It does not say which households carry the debt.',ch(8,'ch-8','The Missing Split','The RBI counts what households owe. It does not say which households. The best answer is eight years old.')+ch(9,'ch-9','What the EMI Takes','Debt matters through what it costs each month. For India\'s households that number has not been published.')+ch(10,'ch-10','Where the Debt Lives','The last survey of household debt by state found it concentrated in the south.')+ch(11,'ch-11','Assets Behind the Debt','Most of what families own is not in the RBI\'s balance sheet. It is land, buildings and gold.','Part'))+
    part(4,'What Could Break','A stress test asks what a plausible shock would do to repayments.',ch(12,'ch-12','Three Shocks','Three shocks to one stylised household and one check on gold collateral.')+ch(13,'ch-13','When the Pay Stops','Young borrowers hold a large share of the newest small loans. Youth unemployment is rising.'))+
    part(5,'What to Measure','The tracker turns this book from a picture into a series.',ch(14,'ch-14','Ten Numbers to Watch','A quarterly tracker of ten indicators, each with its latest value, its trend and a peer anchor.')+ch(15,'ch-15','The Table That Does Not Exist','The RBI could publish debt by income band, age and occupation in the release it already makes.'))+
    '<section class="sec"><ul class="chlist">'+ch('E','epilogue','The 2030 Household Report Card','Seven measures, each with its value today and the direction that would count as progress.')+ch('A','appendix','Method and Sources','How the numbers were built, where they came from and what is still open.')+'</ul></section></article>';
  }

    row('1.1','Household financial liabilities, % of GDP, quarterly','ch-1','primary')+row('1.2','Liabilities, assets and GDP, index, June 2022 = 100','ch-1','derived')+row('1.3','RBI measure and BIS measure side by side','ch-1','primary')+row('1.4','BIS credit to households, % of GDP, since Q2 2007','ch-1','primary')+row('1.5','Household liabilities by lender group, March 2026','ch-1','derived')+
